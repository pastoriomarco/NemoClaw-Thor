# Composer-side lane router design note — Phase 5 of THREE-LANE-MIGRATION-PLAN.md.
#
# Runtime status (2026-06-11): DESIGN-ONLY. Composer does not read this file.
# The live stack starts one assistant lane per Composer process, selected by
# ASSISTANT_PROVIDER (direct|openclaw|hermes). Only that lane's bridge is
# launched. Per-request routing across concurrently live lanes was prototyped
# and reverted on 2026-06-09 because it required multiple sandboxes / agent
# loops for no demonstrated need.
#
# Phase 5 status: `default_lane` records the operator-facing startup default
# that launchers express through ASSISTANT_PROVIDER. `overrides` and
# `rollback_force` are retained as an aspirational policy schema only.
#
# Current evidence (gemma4-12b-it-gguf, 75 total / 66 scored, 2026-06-09):
#   - Direct lane: 47/66 effective after scorer correction, fastest.
#   - OpenClaw lane: 51/66 effective, balanced/sandboxed, current default.
#   - Hermes lane: 54/66 effective in the first head-to-head, but needs
#     apples-to-apples rerun + longitudinal evidence before a default flip.
#
# So today the startup default is OpenClaw. Phase 5 may change this only after
# the pending Hermes rerun and longitudinal gate land.

default_lane: openclaw

overrides:
  # Latency-sensitive requests prefer Direct lane: it skips OpenClaw's
  # 3-trip discovery overhead at the cost of model-quality on cosmos.
  # Suitable for known-workflow operators or simple read-only queries.
  - match:
      request_shape: known_workflow_simple
      time_budget_ms_lt: 5000
    lane: direct

  # Long-running multi-session interactions where memory + skills can
  # accumulate go to Hermes (when enabled).
  - match:
      request_shape: long_running
      conversation_turns_gt: 3
    lane: hermes
    requires: HERMES_LANE_PHASE4_ENABLED

  # User-pinned lanes always win (handled in route handler, not via
  # rule match — this comment is informative).

# Rollback flag: set this to one of the lane ids to override every
# rule + pin and force production back to a known-good lane in <60s.
# Used by SRE as the emergency lever. Empty string = rules apply.
rollback_force: ""
