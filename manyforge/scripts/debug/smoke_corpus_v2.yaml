  prompt: before adding any children, read the current program state so we know the root we'll insert under
  preconditions:
    chain_id: pnp_build
    chain_step: 5
  outcome:
    clarify: none
    draft:
      # v2: a read-only request; the outcome is an unchanged Draft whose root is still the pick_and_place
      # sequence, and an answer that tells the operator what the root is (wording matters here).
      - node: {node_id: sequence, instance_id: pick_and_place, parent: null}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true, must_contain: [pick_and_place, sequence]}
    # chain repair: the complete expected result of this step (smoke_corpus_v2.py applies it after a FAIL)
    repair: []

