            - node: {instance_id: return_rest, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: DELETE_named_specific
  category: tree_delete_node
