# ManyForge assistant smoke corpus v2: outcome form (ASSISTANT_CONTEXT_AND_OUTCOME_TESTS_PLAN.md, part B).
# Rewritten from smoke_corpus_v021.yaml (same ids and intent); a case passes when the Draft shows the
# requested result. Runner: smoke_corpus_v2.py (scorer: outcome_scorer.py). Merged from fragments g1-g3(+g4).
schema_version: manyforge.assistant_smoke_corpus.v2
ported_from: smoke_corpus.yaml (schema v0, baseline iter-32 2026-06-09)
target: 'ManyForge 0.2.1 direct bridge: Program manyforge.program.v3, node catalog 3.0.0'
scenario: examples/mock_ur10e_assistant_scene_authoring.scenario
fresh_program_fixture:
  tree:
    node_id: sequence
    instance_id: pick_and_place
    parameters: {}
    children:
    - node_id: timer
      instance_id: scaffold
      parameters:
        duration_s: 0.1
      children: []
  remove_scene_resources: all
cases:

# ===== fragment g1.yaml =====
# Group g1: pick_and_place_build (20) + catalog_additions (4), outcome form (manyforge.assistant_smoke_corpus.v2).
# PnP chain: fresh program = sequence pick_and_place with one timer child "scaffold" that stays LAST,
# so the n-th inserted step sits at index n-1 under pick_and_place. The index checks encode the
# "first child / after the previous step" wording; the model's own instance ids are never checked.
# Motion poses: position_m is checked against the prompt's coordinates; the prompt gives them as
# absolute base-frame positions, so a relative-mode move would be a wrong result (target_mode, if
# stated, must be absolute; the check is on goal.position_m only).
# Gripper position encodings: Robotiq 2F-140 here is angular: open = 0.0 rad, closed = 0.66 rad (as in the
# demo Program); a named preset is equivalent.

- id: PnP_01_scene_ground
  category: pick_and_place_build
  detail_level: specific
  intent: "Add a thin 2x2x0.01 m box centred at the origin as the ground plane of the scene."
  prompt: 'add a ground plane: a thin box 2x2x0.01 m centered at the origin'
  preconditions:
    chain_step: 1
    chain_id: pnp_build
    fresh_program: true
  outcome:
    clarify: none
    draft:
      # v2: the prompt gives no resource id, so the scene resource is matched by shape and pose (no id).
      - scene_resource: {present: true, shape: {type: box, box_dimensions_m: [2.0, 2.0, 0.01]}, pose: {position_m: [0.0, 0.0, 0.0]}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
    # chain repair: the complete expected result of this step (smoke_corpus_v2.py applies it after a FAIL)
    repair: [{"tool": "scene_draft_upsert_objects", "arguments": {"scene_resources": [{"scene_resource_id": "ground_plane", "shape": {"type": "box", "box_dimensions_m": [2.0, 2.0, 0.01]}, "pose": {"frame_ref": {"kind": "cell_frame"}, "position_m": [0.0, 0.0, 0.0], "orientation": {"rpy_deg": [0.0, 0.0, 0.0]}}}]}}]

