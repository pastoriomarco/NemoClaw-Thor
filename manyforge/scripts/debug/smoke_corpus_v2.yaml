    draft:
      - node: {instance_id: pick_retreat, parent: pick_and_place, index: 1,
               after: command_gripper, before: move_to_pick_approach}
    # the other children keep their relative order (unchanged covers it).
    unchanged: true
    diagnostics: no_new_errors
