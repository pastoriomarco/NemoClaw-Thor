    clarify: required
    clarification_answer: "pick_retreat, move it before attach_graspable."
    draft:
      # judged after the clarification turn
      - node: {instance_id: pick_retreat, parent: pick_and_place, before: attach_graspable,
               after: close_gripper}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: REPLACE_subtree_specific
  category: tree_replace_subtree
  detail_level: specific
  intent: The operator wants the pick moves grouped into one pick_routine fallback node that keeps the same steps.
  prompt: 'replace the pick step (children of pick_and_place from ''descend'' to
  
    ''attach'') with a single ''pick_routine'' subtree that wraps the same
  
    nodes inside a fallback for retry-on-failure semantics
  
    '
  preconditions:
    chain_timeout_s: 240
  outcome:
    # v2: the prompt names 'descend' and 'attach', which do not exist in this Program (they came from
    # the v1 pick-and-place build). The pick step here is move_to_pick, close_gripper and
    # attach_graspable; acting on that reading is accepted when the answer says so, and a question
    # is accepted too because a replace of a named range is destructive.
    clarify: allowed
    clarification_answer: "From move_to_pick to attach_graspable, keeping those three nodes in the same order inside pick_routine."
    draft:
      - node: {instance_id: pick_routine, node_id: fallback, parent: pick_and_place,
               after: move_to_pick_approach, before: pick_retreat}
      - node: {instance_id: move_to_pick, ancestor: pick_routine}
      - node: {instance_id: close_gripper, ancestor: pick_routine}
      - node: {instance_id: attach_graspable, ancestor: pick_routine}
      - subtree_order: {root: pick_routine, order: [move_to_pick, close_gripper, attach_graspable]}
    # the three nodes keep their parameters (count as matched but not edited).
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: REPLACE_simple_medium
  category: tree_replace_subtree
  detail_level: medium
  intent: The operator wants the gripper close step replaced by a 1 second delay.
  prompt: replace the close_gripper action with a 1 second timer
  outcome:
    clarify: none
    draft:
      - node_absent: {instance_id: close_gripper}
      - node: {node_id: timer, parent: pick_and_place, after: move_to_pick, before: attach_graspable,
               parameters: {duration_s: 1.0}}
    # v2: replace-subtree, change-kind, or delete plus insert at the same place give the same tree.
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: CUR_wrap_existing_motion_with_retry
  category: current_tree_control
  detail_level: specific
  intent: The operator wants the move_to_pick motion retried on failure, up to 2 retries.
  prompt: retry the move_to_pick step up to 2 times before failing
  outcome:
    clarify: none
    draft:
      # v2: "retry up to 2 times" is 2 retries = num_attempts 3 (num_attempts counts total runs);
      # num_attempts 2 is also accepted as the common loose reading. Wrap vs insert-and-move give the same tree.
      - any_of:
          - - node: {node_id: retry, parent: pick_and_place, after: move_to_pick_approach,
                     before: close_gripper, children_node_ids: [motion.move_to_pose],
                     parameters: {num_attempts: 3}}
          - - node: {node_id: retry, parent: pick_and_place, after: move_to_pick_approach,
                     before: close_gripper, children_node_ids: [motion.move_to_pose],
                     parameters: {num_attempts: 2}}
      - node: {instance_id: move_to_pick, parent_node_id: retry}
    # move_to_pick keeps its parameters and binding (counts as matched, not edited).
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: CUR_update_existing_motion_speed
  category: current_tree_update
  detail_level: specific
  intent: The operator wants move_to_pick_approach at velocity_scale 0.25 with the rest of its motion settings untouched.
  prompt: set move_to_pick_approach velocity_scale to 0.25 and keep the rest of its motion parameters
  outcome:
    clarify: none
    draft:
      # v2: the prompt names this node's velocity_scale; only this node changes (effective value 0.25).
      # Other motion nodes stay bound to the Program parameter, whose default stays 0.5.
      - node: {instance_id: move_to_pick_approach, effective_parameters: {velocity_scale: 0.25},
               parameters: {target_mode: relative, goal.position_m: [0.0, 0.0, 0.1],
                            target_reference.scene_resource_id: graspable,
                            target.component_id: ur10e_robot, tcp_endpoint.kind: current}}
      # merge: dropped the value_sources check on move_to_pick; unchanged: true already requires it to stay bound.
      - parameter: {id: velocity_scale, present: true, default: 0.5}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ===== fragment g3.yaml =====
# Group 3 of the v2 (outcome form) corpus: scene, parameters, blackboard, clarification and
# runtime-scene cases. Start Program: mock_ur10e_assistant_scene_authoring.scenario/program.yaml
# (tree pick_and_place; scene resources graspable (box 0.1x0.01x0.01 at 0.3,-0.3,0.15, role pick_object)
# and ground; Program parameter velocity_scale float64 = 0.5; empty blackboard).
# Harness extension used in several cases: `scene_resource: {new: true, ...}` matches a resource that
# was not in the Draft before the conversation, for prompts that do not name an id.
# `preconditions` is the v1 `precondition` key, contents unchanged.

