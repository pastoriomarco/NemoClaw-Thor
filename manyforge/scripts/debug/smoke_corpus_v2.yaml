    draft:
      - node: {instance_id: move_to_drop_approach, parent: pick_and_place, after: attach_graspable,
               before: pick_retreat}
      - node: {instance_id: pick_retreat, parent: pick_and_place, after: move_to_drop_approach,
               before: move_to_drop}
