- id: DELETE_generic
  category: tree_delete_node
  detail_level: generic
  intent: The operator wants the last node of the sequence removed.
  prompt: drop the last node
  outcome:
    # v2: "the last node" is answerable here (the tree is flat, so return_rest is last), but
    # deleting is destructive, so a confirming question is acceptable; acting must delete exactly it.
    clarify: allowed
    clarification_answer: "Yes, the last step of pick_and_place, return_rest."
    draft:
      - node_absent: {instance_id: return_rest}
    unchanged: true
    diagnostics: no_new_errors
