    draft:
      - scene_resource:
          new: true
          shape: {type: box, box_dimensions_m: [1.0, 0.02, 0.25]}
          pose: {position_m: [0.0, -0.15, 0.125]}
    unchanged: true
    diagnostics: no_new_errors
