# manyforge.assistant_smoke_corpus.v2: tree_* and current_tree_* cases (group g2).
# Start Program: examples/mock_ur10e_assistant_scene_authoring.scenario/program.yaml
#   sequence pick_and_place with 12 flat children: command_gripper, move_to_pick_approach, move_to_pick,
#   close_gripper, attach_graspable, pick_retreat, move_to_drop_approach, move_to_drop, open_gripper,
#   detach_graspable, drop_retreat, return_rest. Motion nodes bind velocity_scale to Program parameter
#   velocity_scale (default 0.5) via value_sources. No blackboard keys. Scene: graspable, ground.
# Check forms beyond the plan appendix (g2 needs them; the scorer must support or reject them):
#   node.parent: null (top level); node_id as a list (any of); children_order: any;
#   node.ancestor: <instance_id> (anywhere below it); node.value_sources; node.effective_parameters
#   (value after resolving value_sources); {max_exclusive: x} in place of a number;
#   differ: {instances, parameter}; subtree_order. (all_nodes and node.value_sources were rewritten at merge.)
#   Nodes moved into a newly created composite count as matched for 'unchanged'.
