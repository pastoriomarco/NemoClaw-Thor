    draft:
      - node_absent: {instance_id: move_to_pick_approach}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: DELETE_kind_medium
  category: tree_delete_node
  detail_level: medium
  intent: The operator wants the step that closes the gripper removed.
  prompt: remove the gripper-close step
  outcome:
    clarify: none
    draft:
      # v2: only close_gripper closes the gripper (0.66 rad); the other two gripper.command_position
      # nodes open it. Removing it leaves attach_graspable in place: the operator owns that logic.
      - node_absent: {instance_id: close_gripper}
    unchanged: true
