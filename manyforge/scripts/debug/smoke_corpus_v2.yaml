- id: CUR_runtime_remove_then_restore_graspable
  category: current_runtime_scene_mutation
  detail_level: specific
  intent: "The operator wants the Program itself to remove graspable from the runtime scene at the end and upsert it back at its initial pose and size."
  prompt: 'at the end of pick_and_place, remove graspable from the runtime scene

    and then upsert it again at its initial scene pose and size

    '
  outcome:
    clarify: none
    draft:
      # Runtime change: it belongs in the Program tree, as two scene nodes at the end of pick_and_place.
      - node:
          node_id: scene.remove_object
          parent: pick_and_place
          after: return_rest
          parameters: {scene_resource_id: graspable}
      - node:
          node_id: scene.upsert_object
          parent: pick_and_place
          last_child: true
          parameters:
            scene_resource_id: graspable
            shape.type: box
            shape.box_dimensions_m: [0.1, 0.01, 0.01]
            pose.position_m: [0.3, -0.3, 0.15]
      - any_of:     # initial orientation is -45 deg yaw; quaternion or rpy both fulfil it
          - - node: {node_id: scene.upsert_object, parent: pick_and_place, parameters: {pose.orientation.xyzw: [0.0, 0.0, -0.3826834, 0.9238795]}}
          - - node: {node_id: scene.upsert_object, parent: pick_and_place, parameters: {pose.orientation.rpy_deg: [0.0, 0.0, -45.0]}}
      # The static scene is not edited: graspable stays in the Draft scene as it was.
      - scene_resource:
          id: graspable
          present: true
          shape: {type: box, box_dimensions_m: [0.1, 0.01, 0.01]}
          pose: {position_m: [0.3, -0.3, 0.15]}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true, must_contain: [runtime]}

- id: CUR_runtime_update_graspable_pose_each_cycle
  category: current_runtime_scene_mutation
  detail_level: medium
  intent: "The operator wants the Program to reset graspable's runtime pose to its start position after each cycle."
  prompt: after each cycle, set graspable's runtime pose back to [0.3, -0.3, 0.15]
  outcome:
    # v2: the Program has no loop; one run of pick_and_place is the cycle, so the reset goes at its end.
    # Wrapping in a repeat was not asked for. A question about "cycle" is acceptable.
    clarify: allowed
    clarification_answer: "Yes, at the end of the pick_and_place sequence."
    draft:
      - any_of:
          - - node:
                node_id: scene.update_object_pose
                parent: pick_and_place
                last_child: true
                parameters: {scene_resource_id: graspable, pose.position_m: [0.3, -0.3, 0.15]}
          - - node:
                node_id: scene.upsert_object
                parent: pick_and_place
                last_child: true
                parameters: {scene_resource_id: graspable, pose.position_m: [0.3, -0.3, 0.15]}
      # Runtime change: the static Draft scene keeps graspable where it was.
      - scene_resource:
          id: graspable
          present: true
          pose: {position_m: [0.3, -0.3, 0.15]}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true, must_contain: [pose]}

