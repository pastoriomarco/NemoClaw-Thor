# manyforge assistant smoke corpus
# ===================================================================
# Each case = one assistant prompt + its deterministic expected effects.
#
# "Exact expected output" is interpreted as the *contract-level* facts
# that a passing run must produce, not the model's prose. The text
# answer is checked separately as a soft signal (`answer_must_contain`
# / `answer_must_not_contain`).
#
# Schema:
#   id              stable identifier (used in pass/fail tables)
#   category        groups cases for cross-model comparison
#   detail_level    generic | medium | specific (3 prompts per shape)
#   status          active | future. Active cases target the current
#                   known-good composer-assistant lane. Future cases are
#                   intentionally tracked capability probes and should be
#                   skipped unless their required_runtime/tools/nodes are
#                   available.
#   required_runtime optional guard for future cases, e.g.
#                   expanded_node_allowlist, isaac_scene_stream,
#                   deployment_draft_tools, high_level_skills.
#   required_tools  optional list of callback tools that must exist.
#   required_nodes  optional list of behavior catalog node ids that must
#                   exist and be allowed by the active assistant mode.
#   precondition    state that must hold before the prompt is sent
#                   (the harness sets this up before dispatching)
#   prompt          the user message (verbatim, sent to /api/assistant/chat)
#   expected:
#     tools_called          ordered list; each entry has:
#                             name           required tool id
#                             args_contain   key/value asserts on args
#                             allow_retries  boolean — accept a 4xx then 200
#     state_after           dotted-path asserts on program/scene snapshot
#     forbidden_tools       negative assertions
#     answer_must_contain   substrings that should be in the final
#                             assistant message (case-insensitive)
#     answer_must_not_contain  substrings that must NOT appear
#
# Pass criteria (default):
#   - All `tools_called` fire, in order, with args matching args_contain
#   - All `state_after` asserts hold
#   - No `forbidden_tools` fired
#   - All answer asserts hold (soft, can be weighted)
#
# A run that passes tools+state but fails answer asserts is "soft-pass"
# (counts toward effective hit rate but logged for review).
#
# Future cases are not "expected failures"; they are acceptance tests for
# deliberate capability additions. Keep them in this corpus so model-level
# progress can be measured as new tools/nodes are exposed.
# ===================================================================

schema_version: "manyforge.assistant_smoke_corpus.v0"

# Default precondition for every case unless overridden:
default_precondition:
  deployment_path: "/workspace/examples/assistant_modes_scene_authoring.deployment.yaml"
  program_path: "/workspace/examples/pick_and_place_ur10e_robotiq.program.yaml"
  force_discard_overrides: true

# ===================================================================
# starting_state — what the model sees BEFORE the first prompt of each
# case (unless that case sets `precondition.fresh_program: true`, in
# which case the harness loads an empty deployment + empty tree). This
# is captured from the canonical example files referenced above; if
# either file changes, regenerate this block by inspecting the live
# program/scene state via /api/program/state.
# ===================================================================
starting_state:

  # The behavior tree the program ships with: a 12-step pick-and-place
  # sequence rooted at `pick_and_place`. Every case (other than fresh-
  # program ones) starts here. Cases that reference specific node names
  # like `move_to_pick_approach` or `pick_retreat` are matching THESE.
  tree:
    name: pick_and_place
    id: sequence
    children:
      - { name: command_gripper,        id: command_gripper }        # open the gripper before pick
      - { name: move_to_pick_approach,  id: move_manipulator_action }
      - { name: move_to_pick,           id: move_manipulator_action }
      - { name: close_gripper,          id: command_gripper }
      - { name: attach_graspable,       id: attach_object_to_link }
      - { name: pick_retreat,           id: move_manipulator_action }
      - { name: move_to_drop_approach,  id: move_manipulator_action }
      - { name: move_to_drop,           id: move_manipulator_action }
      - { name: open_gripper,           id: command_gripper }
      - { name: detach_graspable,       id: detach_object_from_link }
      - { name: drop_retreat,           id: move_manipulator_action }
      - { name: return_rest,            id: move_manipulator_action }

  # Two static collision objects in the universe frame.
  scene:
    objects:
      - object_id: ground
        shape: { type: box, box_dimensions_m: [1.0, 1.0, 0.2] }
        pose: { frame_id: universe, position_m: [0.0, 0.0, -0.11], orientation_rpy_deg: [0, 0, 0] }
      - object_id: graspable
        shape: { type: box, box_dimensions_m: [0.1, 0.01, 0.01] }
        pose: { frame_id: universe, position_m: [0.3, -0.3, 0.15], orientation_xyzw: [0, 0, -0.382683432365, 0.923879532511] }

  # One program parameter (read-only at runtime, but referenced by
  # PARAM_modify_medium / UPDATE_params_specific etc.).
  parameters:
    - name: velocity_scale
      type: float
      default: 0.5
      constraints: { min_exclusive: 0, max_inclusive: 1 }
      description: "Velocity scale for all moves."

  # No blackboard keys ship with the canonical program. Blackboard cases that
  # need an existing key are seeded by the smoke harness.
  blackboard:
    keys: []

  # Robot/gripper come from the deployment + URDF; not directly mutable
  # by the assistant in composer-assistant mode.
  robot:
    family: ur
    model: ur10e
    gripper: robotiq_2f_140

  # Assistant modes available on this deployment (filtered tool surface).
  # Smoke harness sets assistantMode to "composer-assistant" by default.
  assistant_modes:
    query:               { enabled: true,  allowed_tool_count: 3 }
    composer-assistant:  { enabled: true,  allowed_tool_count: 25 }

# Cases that explicitly start from an empty program + empty scene set
# `precondition.fresh_program: true` (see PnP_01 in Section 13). Those
# cases ignore the `starting_state` above.

cases:

# ===================================================================
# Section 1 — Original 3-prompt smoke set (P1/P2/P3)
# Kept for backward-comparability with prior lane-3x3-smoke.py runs.
# ===================================================================

- id: P1_wrap_root_specific
  category: tree_wrap_root
  detail_level: specific
  prompt: "add a repeat node as root"
  expected:
    tools_called:
      - name: tree_draft_wrap_node
        args_contain:
          targetName: pick_and_place
          wrapper.id: repeat
    state_after:
      program.tree.id: repeat
      program.tree.children[0].name: pick_and_place
    forbidden_tools: [tree_draft_insert_node]
    answer_must_contain: ["repeat", "root"]

- id: P2_scene_add_specific
  category: scene_add
  detail_level: specific
  prompt: "add a box of size 1.0, 0.02, 0.25 in position 0.0, -0.15, 0.125"
  expected:
    tools_called:
      - name: scene_draft_add_object
        alt_names: [scene_draft_upsert_objects]   # equivalent-effect tool
        args_contain:
          shape.type: box
          shape.box_dims: [1.0, 0.02, 0.25]
          pose.position: [0.0, -0.15, 0.125]
    state_after:
      "scene.objects[*].shape.box_dims": "contains [1.0, 0.02, 0.25]"
    answer_must_contain: ["box", "added"]

- id: P2b_scene_add_cylinder_diameter
  category: scene_add
  detail_level: specific
  status: future
  # Filed 2026-06-03; deferred to "future" pending fix of an unrelated
  # composer-side bug surfaced by this case:
  #
  #   POST /api/program/load after the case completed returned HTTP 409
  #   with
  #     "Failed to add scene object 'cylinder_01': add with
  #      shape_type=cylinder requires cylinder_radius_m"
  #
  # That is a real composer-side gap — spec 485 line 420 documents
  # `diameter` as an accepted model-friendly alias, and the
  # scene_draft_add_object tool surface does accept it, but the
  # downstream cycle_manager's apply_scene path (verified via the
  # traceback in composer logs at
  # `manyforge_behavior/runner.py:282 apply_scene`) requires
  # `cylinder_radius_m` on the persisted scene object. The diameter→
  # radius normalization is missing from the composer's
  # `_normalize_scene_resource_aliases` pipeline.
  #
  # Track in: docs/archive/PHASE-0.5-HERMES-SPIKE.md "Composer cylinder
  # diameter→radius normalization gap". Promote back to active once
  # composer normalizes diameter to radius (or vice versa) so that
  # the scene-runtime apply succeeds.
  prompt: "add a cylinder of diameter 0.08 and height 0.20 at position 0.30, 0.10, 0.05"
  expected:
    tools_called:
      - name: scene_draft_add_object
        alt_names: [scene_draft_upsert_objects]
        args_contain:
          shape.type: cylinder
          shape.diameter: 0.08
          shape.height: 0.20
          pose.position: [0.30, 0.10, 0.05]
    answer_must_contain: ["cylinder", "added"]

- id: P3_tree_insert_runtime_obj_specific
  category: tree_insert_runtime_obj
  detail_level: specific
  prompt: |
    add an upsert node at the end of pick_and_place sequence that places
    'graspable' object in the same position and orientation as the scene
    start, with the same original size
  expected:
    tools_called:
      - name: tree_draft_insert_node
        args_contain:
          parentName: pick_and_place
          position: -1   # i.e. last child
          node.id: upsert_collision_object
          node.params.object_id: graspable
          # "same position AND orientation as the scene start": the graspable
          # starts at position [0.3,-0.3,0.15], orientation -45deg about Z.
          # orientation is matched as a rotation, so the model may copy either
          # orientation_xyzw or orientation_rpy_deg from scene state.
          node.params.pose.position_m: [0.3, -0.3, 0.15]
          node.params.pose.orientation_xyzw: [0, 0, -0.382683432365, 0.923879532511]
        allow_retries: true   # P3 typically retries via catalog_read
    forbidden_tools: [scene_draft_add_object, scene_draft_update_object]
    answer_must_contain: ["upsert", "graspable", "pick_and_place"]

# ===================================================================
# Section 2 — Three detail levels for each base shape
# ===================================================================

# --- tree_wrap_root ---
- id: WRAP_root_generic
  category: tree_wrap_root
  detail_level: generic
  # Reframed 2026-06-01: "wrap the tree" omits the WRAPPER kind (repeat/
  # retry/inverter/...). Best agentic behavior is to ask "wrap with what?".
  # The model already does this — corpus now matches. State_after dropped
  # because no mutation should happen on the ASK path.
  prompt: "wrap the tree"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_wrap_node, tree_draft_insert_node]
    answer_must_contain: ["which"]

- id: WRAP_root_medium
  category: tree_wrap_root
  detail_level: medium
  prompt: "wrap the root with a retry decorator"
  expected:
    tools_called:
      - name: tree_draft_wrap_node
        args_contain:
          targetName: pick_and_place
          wrapper.id: retry
    state_after:
      program.tree.id: retry

# --- scene_add ---
- id: SCENE_add_generic
  category: scene_add
  detail_level: generic
  prompt: "add a small box to the scene"
  expected:
    tools_called:
      - name: scene_draft_add_object
        alt_names: [scene_draft_upsert_objects]   # equivalent-effect tool
        args_contain:
          shape.type: box
    answer_must_contain: ["box", "added"]

- id: SCENE_add_medium
  category: scene_add
  detail_level: medium
  prompt: "add a sphere of radius 0.05 in front of the robot"
  expected:
    tools_called:
      - name: scene_draft_add_object
        alt_names: [scene_draft_upsert_objects]   # equivalent-effect tool
        args_contain:
          shape.type: sphere
          shape.sphere_radius_m: 0.05
    answer_must_contain: ["sphere"]

# --- tree_insert_runtime_obj ---
- id: TREE_insert_runtime_generic
  category: tree_insert_runtime_obj
  detail_level: generic
  # Reframed 2026-06-01 (model-bakeoff): "places graspable somewhere"
  # has no position spec (no parent, no sibling, no pose). Best
  # agentic behavior is to ASK: which sequence/parent? what pose?
  # The prior expected-act framing biased the corpus toward Cosmos's
  # "default-anywhere" behavior. Models with proper agentic training
  # (Nemotron-Omni/4B, Qwen3 with thinking) ask first.
  prompt: "add a node that places graspable somewhere"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node, tree_draft_wrap_node]
    answer_must_contain: ["where"]

- id: TREE_insert_runtime_medium
  category: tree_insert_runtime_obj
  detail_level: medium
  prompt: "at the end of the cycle, re-place the graspable at the start position"
  expected:
    tools_called:
      - name: tree_draft_insert_node
        args_contain:
          parentName: pick_and_place
          position: -1
          node.id: upsert_collision_object
          node.params.object_id: graspable
        allow_retries: true

# ===================================================================
# Section 3 — Insert at specific positions in a sequence
# ===================================================================

- id: INSERT_position_first_specific
  category: tree_insert_at_position
  detail_level: specific
  status: active   # node kinds now in the allowlist (2026-05-08)
  precondition: { chain_timeout_s: 220 }   # novel kind + position arg
                                           # triggers extended catalog_read
                                           # recovery loops; 130s default
                                           # is too tight (saw 131.3s in
                                           # the prior run).
  prompt: "insert a wait_for_signal_bool node as child index 0 of pick_and_place that waits for start_pick=true"
  expected:
    tools_called:
      - name: tree_draft_insert_node
        args_contain:
          parentName: pick_and_place
          position: 0
          node.id: wait_for_signal_bool
          # 2026-06-03: schema-drift fix. Live manifest shows
          # wait_for_signal_bool has required params `key` (string) +
          # `expected_value` (bool). Earlier corpus used `signal_id` +
          # `expected` which match an older spec revision. Reverting to
          # the canonical wire names so the args_contain check measures
          # what the model actually emits against what the schema
          # accepts.
          node.params.key: start_pick
          node.params.expected_value: true
        allow_retries: true
    state_after:
      "program.tree.children[0].id": wait_for_signal_bool

- id: INSERT_position_after_named_medium
  category: tree_insert_at_position
  detail_level: medium
  status: active   # node kinds now in the allowlist (2026-05-08)
  prompt: "insert a 2 second timer after move_to_pick_approach"
  expected:
    tools_called:
      - name: tree_draft_insert_node
        args_contain:
          # 2026-06-09: verify the PLACEMENT intent (after the named anchor)
          # rather than demanding parentName. "insert after X" is naturally
          # expressed as afterName=X; Composer treats afterName/parentName as
          # mutually exclusive, so requiring parentName=<parent-of-X> was a
          # false negative. See docs/archive/THREE-LANE-SCORER-NOTE.md.
          afterName: move_to_pick_approach
          node.id: timer
          node.params.duration_s: 2.0
        allow_retries: true
    answer_must_contain: ["timer"]

- id: INSERT_position_before_named_generic
  category: tree_insert_at_position
  detail_level: generic
  status: active   # node kinds now in the allowlist (2026-05-08)
  # Reframed 2026-06-01: "the place step" is ambiguous — pick_and_place
  # has multiple place-related nodes (move_to_drop_approach, move_to_drop,
  # open_gripper, etc.). Best agentic behavior is to ask "which place
  # step?" Models that do this should pass.
  prompt: "put a delay before the place step"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node]
    answer_must_contain: ["which"]

# ===================================================================
# Section 4 — Parallel composites
# ===================================================================

- id: PARALLEL_safety_specific
  category: tree_insert_parallel
  detail_level: specific
  status: future
  required_runtime: force_monitor_node
  required_nodes: [force_monitor]
  prompt: |
    wrap the lift→transport segment of pick_and_place with a parallel
    composite that runs the existing motion sequence concurrently with
    a force_monitor node that halts on > 30 N
  expected:
    tools_called:
      - name: tree_draft_replace_subtree
        args_contain:
          subtree_root.kind: parallel
        allow_retries: true
    answer_must_contain: ["parallel"]

- id: PARALLEL_concurrent_medium
  category: tree_insert_parallel
  detail_level: medium
  status: active   # node kinds now in the allowlist (2026-05-08)
  # Reframed 2026-06-01: names the children (gripper open + status update)
  # but no PARENT node specified. Best agentic behavior is to ask which
  # parent / where to place the parallel composite.
  prompt: "add a parallel that runs gripper open and a status update at the same time"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node]
    answer_must_contain: ["which"]

- id: PARALLEL_generic
  category: tree_insert_parallel
  detail_level: generic
  # Reframed 2026-05-08 from "expect insert_node parallel" to expected-
  # clarification: "add a parallel" alone is genuinely under-specified
  # (no children listed, no parent, no position). cosmos-8b reliably
  # produces text without firing in the prior run; the bounded-autonomy
  # answer is to ask for the missing detail.
  prompt: "add a parallel"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node, tree_draft_wrap_node]
    answer_must_contain: ["which", "where"]

# ===================================================================
# Section 5 — Fallback composites
# ===================================================================

- id: FALLBACK_retry_specific
  category: tree_insert_fallback
  detail_level: specific
  status: active   # node kinds now in the allowlist (2026-05-08)
  prompt: |
    insert a fallback as the second child of pick_and_place containing
    two move_manipulator_action nodes named primary_pick and backup_pick that
    each try a different grasp pose
  expected:
    tools_called:
      - name: tree_draft_insert_node
        args_contain:
          parentName: pick_and_place
          position: 1
          node.id: fallback
        allow_retries: true
    answer_must_contain: ["fallback"]

- id: FALLBACK_alternate_medium
  category: tree_insert_fallback
  detail_level: medium
  # Reframed 2026-06-01: "before the gripper close" — pick_and_place has
  # multiple gripper-related nodes (command_gripper open, close_gripper,
  # open_gripper). And "two alternate approach paths" doesn't specify the
  # actual approach poses. Best agentic behavior is to ask.
  prompt: "add a fallback node before the gripper close that tries two alternate approach paths"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node]
    answer_must_contain: ["which"]

- id: FALLBACK_generic
  category: tree_insert_fallback
  detail_level: generic
  # Reframed 2026-05-08 from "expect insert_node fallback" to expected-
  # clarification: "add a fallback" alone has no children/parent/position.
  # Same rationale as PARALLEL_generic.
  prompt: "add a fallback"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node, tree_draft_wrap_node]
    answer_must_contain: ["which", "where"]

# ===================================================================
# Section 6 — Update existing-node params
# ===================================================================

- id: UPDATE_params_specific
  category: tree_update_node_params
  detail_level: specific
  prompt: "set the move_to_pick_approach node's velocity_scale parameter to 0.3"
  expected:
    tools_called:
      - name: tree_draft_update_node_params
        args_contain:
          nodeName: move_to_pick_approach
          params.velocity_scale: 0.3
          merge: true
    state_after:
      "program.tree.children[name=move_to_pick_approach].params.velocity_scale": 0.3

- id: UPDATE_params_medium
  category: tree_update_node_params
  detail_level: medium
  prompt: "slow down move_to_pick_approach by half"
  expected:
    tools_called:
      - name: tree_draft_update_node_params
        args_contain:
          nodeName: move_to_pick_approach
          merge: true
        allow_retries: true
    answer_must_contain: ["move_to_pick_approach", "velocity"]

- id: UPDATE_params_generic
  category: tree_update_node_params
  detail_level: generic
  # Reframed 2026-06-01 (model-bakeoff): "make the robot move slower"
  # is multi-ambiguous — there are several move_manipulator_action
  # nodes in pick_and_place (move_to_pick, move_to_pre_place,
  # move_to_place...), each with its own velocity_scale. Best agentic
  # behavior is to ASK which node(s) to slow down and by how much.
  # Prior expected-act framing rewarded blind-guessing one node.
  prompt: "make the robot move slower"
  expected:
    tools_called: []
    forbidden_tools: [tree_draft_insert_node, tree_draft_delete_node, tree_draft_update_node_params]
    answer_must_contain: ["which"]

# ===================================================================
# Section 7 — Delete nodes
# ===================================================================

- id: DELETE_named_specific
  category: tree_delete_node
  detail_level: specific
  prompt: "delete the node named move_to_pick_approach"
  expected:
    tools_called:
      - name: tree_draft_delete_node
        args_contain:
          nodeName: move_to_pick_approach
    state_after:
      "program.tree.children[*].name": "does_not_contain move_to_pick_approach"
    answer_must_contain: ["move_to_pick_approach", "delete"]

- id: DELETE_kind_medium
  category: tree_delete_node
  detail_level: medium
  prompt: "remove the gripper-close step"
  expected:
    tools_called:
      - name: tree_draft_delete_node
        allow_retries: true

- id: DELETE_generic
  category: tree_delete_node
  detail_level: generic
  prompt: "drop the last node"
  expected:
    tools_called:
      - name: tree_draft_delete_node
        allow_retries: true

# ===================================================================
# Section 8 — Move nodes
# ===================================================================

- id: MOVE_swap_specific
  category: tree_move_node
  detail_level: specific
  prompt: "move pick_retreat to be the second child of pick_and_place"
  expected:
    tools_called:
      - name: tree_draft_move_node
        args_contain:
          nodeName: pick_retreat
          newParentName: pick_and_place
          index: 1
        allow_retries: true
    state_after:
      "program.tree.children[1].name": pick_retreat

- id: MOVE_reorder_medium
  category: tree_move_node
  detail_level: medium
  prompt: "swap the order of pick_retreat and move_to_drop_approach"
  expected:
    tools_called:
      - name: tree_draft_move_node
        allow_retries: true

- id: MOVE_generic
  category: tree_move_node
  detail_level: generic
  # 2026-05-09 (iter 9): bounded-autonomy rubric (matches CLARIFY_*).
  # Read-only inspection allowed; mutations forbidden. Soft-passes if
  # the model asks "which step" without firing any tree mutation tool.
  prompt: "move that step earlier"
  expected:
    forbidden_tools:
      - tree_draft_move_node
      - tree_draft_wrap_node
      - tree_draft_replace_subtree
      - tree_draft_change_node_kind
      - tree_draft_insert_node
      - tree_draft_delete_node
      - tree_draft_update_node_params
    answer_must_contain: ["which", "step"]

# ===================================================================
# Section 9 — Replace subtree
# ===================================================================

- id: REPLACE_subtree_specific
  category: tree_replace_subtree
  detail_level: specific
  precondition: { chain_timeout_s: 240 }   # multi-node subtree replacement
                                           # is the slowest pattern in the
                                           # corpus (saw 140.1s timeout in
                                           # the prior run).
  prompt: |
    replace the pick step (children of pick_and_place from 'descend' to
    'attach') with a single 'pick_routine' subtree that wraps the same
    nodes inside a fallback for retry-on-failure semantics
  expected:
    tools_called:
      - name: tree_draft_replace_subtree
        args_contain:
          subtree_root.kind: fallback
        allow_retries: true
    answer_must_contain: ["replace"]

- id: REPLACE_simple_medium
  category: tree_replace_subtree
  detail_level: medium
  status: active   # node kinds now in the allowlist (2026-05-08)
  prompt: "replace the close_gripper action with a 1 second timer"
  expected:
    tools_called:
      - name: tree_draft_replace_subtree   # may also be delete+insert
        allow_retries: true

# ===================================================================
# Section 10 — Scene update / remove
# ===================================================================

- id: SCENE_update_pose_specific
  category: scene_update
  detail_level: specific
  prompt: "move graspable to position (0.5, 0.1, 0.05)"
  expected:
    tools_called:
      - name: scene_draft_update_object
        args_contain:
          objectId: graspable
          pose.position_m: [0.5, 0.1, 0.05]
    state_after:
      "scene.objects[object_id=graspable].pose_in_universe.position_m": [0.5, 0.1, 0.05]

- id: SCENE_update_size_medium
  category: scene_update
  detail_level: medium
