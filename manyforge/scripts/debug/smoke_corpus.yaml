- id: CUR_runtime_remove_then_restore_graspable
  category: current_runtime_scene_mutation
  detail_level: specific
  status: active
  prompt: |
    at the end of pick_and_place, remove graspable from the runtime scene
    and then upsert it again at its initial scene pose and size
  expected:
    tools_called:
      - name: scene_inspect
      - name: tree_draft_insert_node
        args_contain:
          parentName: pick_and_place
          node.id: remove_collision_object
          node.params.object_id: graspable
        allow_retries: true
      - name: tree_draft_insert_node
        args_contain:
          parentName: pick_and_place
          node.id: upsert_collision_object
          node.params.object_id: graspable
          # catalog v1 (0.2.0): shape is a nested object; flat shape_type /
          # top-level box_dimensions_m are rejected by tree-param validation.
          node.params.shape.type: box
          node.params.shape.box_dimensions_m: [0.1, 0.01, 0.01]
          node.params.pose.frame_id: universe
          # "at its initial scene pose": position [0.3,-0.3,0.15] + orientation
          # -45deg about Z. orientation is matched as a rotation (either rep).
          node.params.pose.position_m: [0.3, -0.3, 0.15]
          node.params.pose.orientation_xyzw: [0, 0, -0.382683432365, 0.923879532511]
        allow_retries: true
    forbidden_tools: [scene_draft_remove_objects, scene_draft_update_object]
    answer_must_contain: ["runtime", "graspable"]

