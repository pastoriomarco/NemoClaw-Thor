# ===================================================================
# Notes for the harness implementer
# ===================================================================
# - Cases share `default_precondition` unless they override `fresh_program`
#   or `chain_id`.
# - Cases without `status` are active by default. A harness should skip
#   `status: future` cases unless its run profile declares the matching
#   `required_runtime`, `required_tools`, and `required_nodes` capabilities.
# - Cases in the SAME `chain_id` MUST run in `chain_step` order on the same
#   conversation; cases in different chains (or no chain_id) reset the
#   program before running.
# - `args_contain` does deep-key matching. Lists are checked element-wise
#   when both values are lists; otherwise a list value means "contains
#   element". Strings are case-sensitive substring matches by default.
# - `allow_retries: true` accepts the documented Composer pattern:
#   first call may 4xx (catalog/schema mismatch) → model calls
#   `catalog_read` → retries with corrected args → 200. Counts as one
#   logical pass.
# - `state_after` queries the live program/scene snapshot via
#   `/api/program/state`. Path syntax `[name=foo]` selects the first
#   element where `.name == "foo"`. `[*]` projects all elements.
# - Soft-pass (tools+state ✅, answer asserts ❌) is logged but counted
#   toward effective hit rate by default. Configure via
#   `--strict-answer-asserts` to demote to fail.
