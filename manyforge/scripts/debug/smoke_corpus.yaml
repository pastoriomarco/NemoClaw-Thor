  precondition: { chain_id: pnp_build, chain_step: 5 }
  # 2026-05-09 (iter 5): the empty-program fixture pre-names the root
  # `pick_and_place`, so this turn no longer needs a rename. Instead it
  # asks the assistant to verify the current tree before the build chain
  # starts inserting children — a turn that REQUIRES a tool call
  # (`program_read`). Empirically PnP_06+ collapses to text-only
  # narration when PnP_05 is a "no-op text answer"; keeping the model in
  # tool-use mode here is what actually unblocks the rest of the chain.
  prompt: "before adding any children, read the current program state so we know the root we'll insert under"
  expected:
    tools_called:
