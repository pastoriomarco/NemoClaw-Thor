# ManyForge assistant smoke corpus, ported to ManyForge 0.2.1 (Program v3).
# Generated once from smoke_corpus.yaml; edit this file directly from now on.
# Review: manyforge/docs/smoke-evidence/2026-11-09-phase-a-0.2.1/CORPUS-REVIEW.md
# Runner: smoke_corpus_direct.py. Expected-value forms: 'one_of a|b', index 'end'.
schema_version: manyforge.assistant_smoke_corpus.v1
ported_from: smoke_corpus.yaml (schema v0, baseline iter-32 2026-06-09)
target: 'ManyForge 0.2.1 direct bridge: Program manyforge.program.v3, node catalog 3.0.0'
scenario: examples/mock_ur10e_assistant_scene_authoring.scenario
fresh_program_fixture:
  tree:
    node_id: sequence
    instance_id: pick_and_place
    parameters: {}
    children:
    - node_id: timer
      instance_id: scaffold
      parameters:
        duration_s: 0.1
      children: []
  remove_scene_resources: all
cases:
- id: P1_wrap_root_specific
  category: tree_wrap_root
  detail_level: specific
  prompt: add a repeat node as root
  expected:
    forbidden_tools:
    - tree_draft_insert_node
    answer_must_contain:
    - repeat
    - root
    tools_called:
    - name: tree_draft_wrap_node
      args_contain:
        target_instance_id: pick_and_place
        wrapper.node_id: repeat
    state_after:
      program.tree.node_id: repeat
      program.tree.children[0].instance_id: pick_and_place
- id: P2_scene_add_specific
  category: scene_add
  detail_level: specific
  prompt: add a box of size 1.0, 0.02, 0.25 in position 0.0, -0.15, 0.125
  expected:
    answer_must_contain:
    - box
    - added
    tools_called:
    - name: scene_draft_add_object
      args_contain:
        scene_resource.shape.type: box
        scene_resource.shape.box_dimensions_m:
        - 1.0
        - 0.02
        - 0.25
        scene_resource.pose.position_m:
        - 0.0
        - -0.15
        - 0.125
      alt_names:
      - scene_draft_upsert_objects
    state_after:
      scene.objects[*].shape.box_dimensions_m: contains [1.0, 0.02, 0.25]
- id: P3_tree_insert_runtime_obj_specific
  category: tree_insert_runtime_obj
  detail_level: specific
  prompt: 'add an upsert node at the end of pick_and_place sequence that places

    ''graspable'' object in the same position and orientation as the scene

    start, with the same original size

    '
  expected:
    forbidden_tools:
    - scene_draft_add_object
    - scene_draft_update_object
    answer_must_contain:
    - upsert
    - graspable
    - pick_and_place
    tools_called:
    - name: tree_draft_insert_node
      args_contain:
        parent_instance_id: pick_and_place
        index: end
        node.node_id: scene.upsert_object
        node.parameters.scene_resource_id: graspable
        node.parameters.pose.position_m:
        - 0.3
        - -0.3
        - 0.15
        node.parameters.pose.orientation_xyzw:
        - 0
        - 0
        - -0.382683432365
        - 0.923879532511
      allow_retries: true
