      - node: {instance_id: move_to_pick,
               parameters: {target_mode: relative, target_reference.scene_resource_id: graspable,
                            goal.position_m: [0.0, 0.0, 0.075]}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

