    clarify: none
    draft:
      - blackboard_key: {key: pick_plan, present: true, type: pick_planning_result}
      - any_of:
          - - node:
                node_id: planning.plan_pick_sequence
                parent: pick_and_place
                index: 0
                parameters: {target.component_id: ur10e_robot, tool_target.component_id: robotiq_2f_140,
                             carrier_frame_ref.component_id: robotiq_2f_140, carrier_frame_ref.frame_id: tcp,
                             selected_object_id: graspable, contact_policy_id: grasp_contact, output_key: pick_plan,
                             tool_position.kind: named_preset, tool_position.name: closed}
          - - node:
                node_id: planning.plan_pick_sequence
                parent: pick_and_place
                index: 0
                parameters: {target.component_id: ur10e_robot, tool_target.component_id: robotiq_2f_140,
                             carrier_frame_ref.component_id: robotiq_2f_140, carrier_frame_ref.frame_id: tcp,
                             selected_object_id: graspable, contact_policy_id: grasp_contact, output_key: pick_plan,
