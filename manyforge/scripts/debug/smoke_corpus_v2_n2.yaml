# ManyForge assistant smoke corpus v2: outcome form (ASSISTANT_CONTEXT_AND_OUTCOME_TESTS_PLAN.md, part B).
# Rewritten from smoke_corpus_v021.yaml (same ids and intent); a case passes when the Draft shows the
# requested result. Runner: smoke_corpus_v2.py (scorer: outcome_scorer.py). Merged from fragments g1-g3(+g4).
schema_version: manyforge.assistant_smoke_corpus.v2
ported_from: smoke_corpus.yaml (schema v0, baseline iter-32 2026-06-09)
target: 'ManyForge 0.2.1 direct bridge: Program manyforge.program.v3, node catalog 3.0.0'
scenario: examples/mock_ur10e_assistant_scene_authoring.scenario
fresh_program_fixture:
  tree:
    node_id: sequence
    instance_id: pick_and_place
    parameters: {}
    children:
    - node_id: timer
      instance_id: scaffold
      parameters:
        duration_s: 0.1
      children: []
  remove_scene_resources: all
cases:

# ===== fragment g4-new.yaml =====
# Group g4: NEW cases (N2_*), outcome form (manyforge.assistant_smoke_corpus.v2).
#
# Scenario (default): examples/mock_ur10e_assistant_scene_authoring.scenario, extended 2026-11-09 into a
# Mock pick-and-place workcell. Program unchanged: sequence pick_and_place with 12 flat children
#   command_gripper, move_to_pick_approach, move_to_pick, close_gripper, attach_graspable, pick_retreat,
#   move_to_drop_approach, move_to_drop, open_gripper, detach_graspable, drop_retreat, return_rest.
#   Moves bind velocity_scale to the Program parameter velocity_scale (0.5). Scene: graspable, ground.
#   No blackboard keys, no contact policies.
# Deployment additions: Mock I/O device cell_io (command target io)
#   inputs : part_present (pick-table part sensor, starts true), clamp_pressure_ok (drop-fixture clamp
#            pressure switch, follows clamp_valve after 300 ms), touch_probe, start_button, zone_occupied
#            (area scanner)
#   outputs: clamp_valve, alarm_light, ready_light
#   rule   : zone_intrusion (all_motion stop while zone_occupied is true, active at start)
# Targets: arm = {component_id: ur10e_robot, command_target_id: arm} (base frame "base");
#   gripper = {component_id: robotiq_2f_140, command_target_id: gripper} (frame "tcp").
# Robotiq 2F-140 positions: open = named_preset open or angular 0.0 rad; closed = named_preset closed or
#   angular 0.66 rad (as in the demo Program); both encodings are accepted where the prompt says open/closed.
#
# scenario: sim -> examples/sim_ur10e_assistant_scene_authoring.scenario (unchanged; root sequence
#   isaac_light_cycle: set_cheese_initial_pose, play_simulation, wait_for_simulation, open_gripper_start, ...
#   return_rest, reset_simulation, wait_after_reset (timer 3 s), pause_simulation).
#
# Check forms beyond the plan appendix. Forms from g2 reused: node.parent: null; node_id as a list (any of);
# node.ancestor; node.value_sources; node.effective_parameters; {max_exclusive: x}; subtree_order;
# children_order: any. Forms NEW in g4 (the scorer must support or reject them):
#   node.ancestor_node_id: X        some ancestor of the node has node_id X (X may be a list: any of).
#   subtree_order.root_node_id: X   the root is the (single) new node with node_id X, instead of an instance id.
#   subtree_order.order entries     may be a node match {node_id, parameters?, value_sources?} (first
#                                   pre-order match) as well as an instance id; the entries must appear in
#                                   this pre-order (other nodes may sit between them).
#   parameters keys with list index 'path[-2].position_m', 'path[-1].position_m'.
#   {min_exclusive: x}              in place of a number.
#   blackboard_key without key      any new key of that type is present (model chooses the name).
#   parameter without id            any new parameter matching type/default is present.
#   outcome.allow_new_node_ids      with unchanged: true, extra NEW nodes with these node_ids (control-flow
#                                   glue such as sequence/fallback) are tolerated beyond the checked ones.
#   scenario: sim                   the case runs on the sim scenario below instead of the default.
# Fixtures use the Draft mutation tools as in v1 (blackboard_draft_upsert_keys,
# program_draft_upsert_parameters, program_draft_upsert_contact_policies; Composer computes the contact
# policy version).

# ---------------------------------------------------------------- I/O ---------------------------------------
- id: N2_IO_check_input_specific
  category: n2_io
  detail_level: specific
  intent: "Check that the pick-table part sensor is on right before the robot approaches the pick."
  prompt: right before move_to_pick_approach, check that the part_present input on cell_io is on
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.check_input, parent: pick_and_place, before: move_to_pick_approach,
               parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_IO_get_input_specific
  category: n2_io
  detail_level: specific
  intent: "Record the start button state in a new bool key at the start of the cycle."
  prompt: at the start of pick_and_place, read the start_button input into a new bool blackboard key called start_pressed
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: start_pressed, present: true, type: bool}
      - node: {node_id: io.get_input, parent: pick_and_place, index: 0,
               parameters: {signal.component_id: cell_io, signal.signal_name: start_button, output_key: start_pressed}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_IO_wait_for_input_medium
  category: n2_io
  detail_level: medium
  intent: "The cycle starts only after the operator presses the start button, waiting at most 30 s."
  prompt: make the cycle begin by waiting up to 30 seconds for the operator to press the start button
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.wait_for_input, parent: pick_and_place, index: 0,
               parameters: {signal.component_id: cell_io, signal.signal_name: start_button, expected_value: true,
                            timeout_s: 30.0}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_IO_clear_outside_change_specific
  category: n2_io
  detail_level: specific
  intent: "Clear the changed-outside flag of the clamp valve output at the start of each cycle."
  prompt: someone sometimes switches the clamp valve by hand from the I/O panel; at the start of the cycle, clear the changed-outside flag of the clamp_valve output
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.clear_outside_change, parent: pick_and_place, index: 0,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_valve}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_IO_part_check_generic
  category: n2_io
  detail_level: generic
  intent: "Check the part sensor somewhere before the grasp."
  prompt: check the part sensor before picking
  preconditions: {}
  outcome:
    # Acting directly is fine: a check (or wait) of part_present == true anywhere before the gripper closes.
    clarify: allowed
    clarification_answer: Check that part_present on cell_io is on, right before move_to_pick_approach.
    draft:
      - any_of:
          - - node: {node_id: [io.check_input, io.wait_for_input], parent: pick_and_place, before: move_to_pick_approach,
                     parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true}}
          - - node: {node_id: [io.check_input, io.wait_for_input], parent: pick_and_place, before: move_to_pick,
                     parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true}}
          - - node: {node_id: [io.check_input, io.wait_for_input], parent: pick_and_place, before: close_gripper,
                     parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ---------------------------------------------------------------- logic -------------------------------------
- id: N2_LOGIC_set_value_specific
  category: n2_logic
  detail_level: specific
  intent: "Mark the cycle as done by writing true to cycle_ok at the end."
  prompt: at the end of pick_and_place, set the blackboard key cycle_ok to true
  preconditions:
    fixtures:
    - tool: blackboard_draft_upsert_keys
      arguments:
        keys:
        - key: cycle_ok
          type: bool
          access: read_write
          persistence: run
          initial: false
          description: Seed blackboard key inserted by the smoke harness.
  outcome:
    clarify: none
    draft:
      - node: {node_id: logic.set_value, parent: pick_and_place, last_child: true,
               parameters: {key: cycle_ok, value: true}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_LOGIC_check_condition_specific
  category: n2_logic
  detail_level: specific
  intent: "Gate the cycle on the bool Program parameter enable_cycle."
  prompt: at the start of pick_and_place, add a condition check that passes only when the Program parameter enable_cycle is true
  preconditions:
    fixtures:
    - tool: program_draft_upsert_parameters
      arguments:
        parameters:
        - parameter_id: enable_cycle
          type: bool
          default: true
          description: Seed parameter inserted by the smoke harness.
  outcome:
    clarify: none
    draft:
      - node: {node_id: logic.check_condition, parent: pick_and_place, index: 0,
               value_sources: {condition: {kind: program_parameter, reference: enable_cycle}}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_LOGIC_cell_enabled_generic
  category: n2_logic
  detail_level: generic
  intent: "Run the cycle only when the cell_enabled Program parameter is true."
  prompt: only run the cycle when the cell is enabled
  preconditions:
    fixtures:
    - tool: program_draft_upsert_parameters
      arguments:
        parameters:
        - parameter_id: cell_enabled
          type: bool
          default: true
          description: Seed parameter inserted by the smoke harness.
  outcome:
    clarify: allowed
    clarification_answer: Use the Program parameter cell_enabled and check it as the first step of pick_and_place.
    draft:
      - any_of:
          - - node: {node_id: logic.check_condition, parent: pick_and_place, index: 0,
                     value_sources: {condition: {kind: program_parameter, reference: cell_enabled}}}
          # the check as the first child of a new root sequence above pick_and_place is the same behaviour
          - - node: {node_id: sequence, parent: null, children_node_ids: [logic.check_condition, sequence]}
            - node: {node_id: logic.check_condition, parent_node_id: sequence,
                     value_sources: {condition: {kind: program_parameter, reference: cell_enabled}}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ---------------------------------------------------------------- control flow ------------------------------
- id: N2_CTRL_inverter_specific
  category: n2_control
  detail_level: specific
  intent: "Fail the cycle at the start if the gripper reports the failed state."
  prompt: at the start of pick_and_place, make sure the Robotiq gripper is not in the failed state by checking its status for failed and inverting the result
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: inverter, parent: pick_and_place, index: 0, children_node_ids: [gripper.check_status]}
      - node: {node_id: gripper.check_status, parent_node_id: inverter,
               parameters: {expected_state: failed, target.component_id: robotiq_2f_140, target.command_target_id: gripper}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_CTRL_zone_not_occupied_medium
  category: n2_control
  detail_level: medium
  intent: "The cycle fails at once when the area scanner reports the zone occupied."
  prompt: fail the cycle right at the start if the area scanner reports the zone occupied
  preconditions: {}
  outcome:
    # an inverted check of zone_occupied == true and a plain check of zone_occupied == false are equivalent
    clarify: allowed
    clarification_answer: Check zone_occupied on cell_io as the first step and fail if it is on.
    draft:
      - any_of:
          - - node: {node_id: inverter, parent: pick_and_place, index: 0, children_node_ids: [io.check_input]}
            - node: {node_id: io.check_input, parent_node_id: inverter,
                     parameters: {signal.component_id: cell_io, signal.signal_name: zone_occupied, expected_value: true}}
          - - node: {node_id: io.check_input, parent: pick_and_place, index: 0,
                     parameters: {signal.component_id: cell_io, signal.signal_name: zone_occupied, expected_value: false}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ---------------------------------------------------------------- motion ------------------------------------
- id: N2_MOTION_cartesian_path_medium
  category: n2_motion
  detail_level: medium
  intent: "After the pick retreat, move in a straight line through two given base-frame points."
  prompt: after pick_retreat, add one straight-line Cartesian move of the UR10e through (0.3, 0.0, 0.3) and then (0.3, 0.3, 0.3) in its base frame, keeping the tool pointing down
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # the last two waypoints are the stated points (a leading start waypoint is allowed); orientation is
      # not checked because "pointing down" leaves the yaw open.
      - node:
          node_id: motion.follow_cartesian_path
          parent: pick_and_place
          after: pick_retreat
          parameters:
            target.component_id: ur10e_robot
            target.command_target_id: arm
            base_frame.frame_id: base
            'path[-2].position_m': [0.3, 0.0, 0.3]
            'path[-1].position_m': [0.3, 0.3, 0.3]
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_MOTION_move_until_signal_specific
  category: n2_motion
  detail_level: specific
  intent: "Descend toward the part and stop softly when the touch probe turns on."
  prompt: after move_to_pick_approach, add a move of the UR10e down to (0.3, -0.3, 0.17) in its base frame, tool pointing down (rpy 180, 0, -180), that stops with soft_on_path as soon as the touch_probe input on cell_io turns on
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node:
          node_id: motion.move_until_signal
          parent: pick_and_place
          after: move_to_pick_approach
          parameters:
            target.component_id: ur10e_robot
            goal.position_m: [0.3, -0.3, 0.17]
            goal.orientation.rpy_deg: [180.0, 0.0, -180.0]
            stop_mode: soft_on_path
            interrupt_condition.compare.operand.signal.component_id: cell_io
            interrupt_condition.compare.operand.signal.signal_name: touch_probe
            interrupt_condition.compare.value: true
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_MOTION_probe_search_specific
  category: n2_motion
  detail_level: specific
  intent: "Probe toward the part top under the grasp contact policy, stopping on the touch probe."
  prompt: after move_to_pick_approach, add a probe search of the UR10e toward (0.3, -0.3, 0.14) in its base frame, tool pointing down (rpy 180, 0, -180), using contact policy grasp_contact on graspable; it stops with soft_on_path when touch_probe on cell_io turns on
  preconditions:
    fixtures: &grasp_contact_fixtures
    - tool: blackboard_draft_upsert_keys
      arguments:
        keys:
        - key: pick_target
          type: scene_resource
          access: read_write
          persistence: run
          initial: graspable
          description: Seed blackboard key inserted by the smoke harness.
    - tool: program_draft_upsert_contact_policies
      arguments:
        contact_policies:
        - api_version: manyforge.contact_policy.v1
          policy_id: grasp_contact
          mode: contact_grasp
          sensing_mode: geometry_only
          default_unmatched_response: hard_stop
          zones:
          - zone_id: fingertips
            body_pairs:
            - body_a: {kind: motion_endpoint}
              body_b: {kind: runtime_object, runtime_object_id: pick_target}
            max_penetration_m: 0.002
            terminal_window_start_fraction: 0.8
            violation_response: hard_stop
  outcome:
    clarify: none
    draft:
      - node:
          node_id: motion.probe_search
          parent: pick_and_place
          after: move_to_pick_approach
          parameters:
            target.component_id: ur10e_robot
            goal.position_m: [0.3, -0.3, 0.14]
            goal.orientation.rpy_deg: [180.0, 0.0, -180.0]
            contact_policy_id: grasp_contact
            contact_scene_resource_id: graspable
            stop_mode: soft_on_path
            interrupt_condition.compare.operand.signal.component_id: cell_io
            interrupt_condition.compare.operand.signal.signal_name: touch_probe
            interrupt_condition.compare.value: true
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_MOTION_set_tcp_specific
  category: n2_motion
  detail_level: specific
  intent: "Make the gripper's default TCP the arm's active TCP at the start."
  prompt: at the start of pick_and_place, make the Robotiq gripper's default TCP the active TCP of the UR10e arm
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: motion.set_tcp, parent: pick_and_place, index: 0,
               parameters: {target.component_id: ur10e_robot, target.command_target_id: arm,
                            tcp.kind: default_of_target, tcp.target.component_id: robotiq_2f_140,
                            tcp.target.command_target_id: gripper}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_MOTION_probe_top_generic
  category: n2_motion
  detail_level: generic
  intent: "Find the top of the part with the touch probe between the approach and the grasp."
  prompt: before grasping, feel for the top of the part with the touch probe
  preconditions: {}
  outcome:
    # Acting directly: a signal-stopped move on touch_probe between the approach and close_gripper; the goal
    # pose is the model's choice then. (probe_search would need a contact policy, which this Program lacks.)
    clarify: allowed
    clarification_answer: Use a move from the approach down to (0.3, -0.3, 0.14) in the UR10e base frame, tool pointing down, that stops when touch_probe turns on; put it right after move_to_pick_approach.
    draft:
      - any_of:
          - - node: {node_id: motion.move_until_signal, parent: pick_and_place, after: move_to_pick_approach,
                     parameters: {interrupt_condition.compare.operand.signal.signal_name: touch_probe,
                                  interrupt_condition.compare.value: true}}
          - - node: {node_id: motion.move_until_signal, parent: pick_and_place, before: close_gripper,
                     parameters: {interrupt_condition.compare.operand.signal.signal_name: touch_probe,
                                  interrupt_condition.compare.value: true}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ---------------------------------------------------------------- scene -------------------------------------
- id: N2_SCENE_add_object_runtime_specific
  category: n2_scene
  detail_level: specific
  intent: "At the end of the cycle the Program adds a spare tote box to the planning scene."
  prompt: the operator puts a spare tote at (0.0, 0.5, 0.05) during each cycle; at the end of pick_and_place, add it to the scene as a 0.3 x 0.2 x 0.1 m box called spare_tote, in the cell frame
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: scene.add_object, parent: pick_and_place, last_child: true,
               parameters: {scene_resource_id: spare_tote, shape.type: box, shape.box_dimensions_m: [0.3, 0.2, 0.1],
                            pose.position_m: [0.0, 0.5, 0.05]}}
      # the Program declares every resource a node names (as in sim_ur10e_runtime_collision_stop), so the
      # Draft scene also holds spare_tote; without it the Draft shows an error diagnostic.
      - scene_resource: {id: spare_tote, present: true, shape: {type: box, box_dimensions_m: [0.3, 0.2, 0.1]}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

