    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_box_left_table_full_stop
  category: n2_task
  detail_level: specific
  intent: "Before the pick, full-stop the cell when the box is outside the table area."
  prompt: 'stop the cell if the box has left the table area before we pick it: read the box pose into box_pose first; the table area is x and y from -0.5 to 0.5 m and z from 0.0 to 0.5 m in the cell frame'
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: box_pose, present: true, type: stored_pose}
      - node: {node_id: scene.get_object_pose, ancestor: pick_and_place,
               parameters: {scene_resource_id: graspable, output_key: box_pose}}
      - node: {node_id: geometry.check_pose_bounds, ancestor: pick_and_place,
               value_sources: {pose: {kind: blackboard_key, reference: box_pose}},
               parameters: {frame_ref.kind: cell_frame, min_position_m: [-0.5, -0.5, 0.0], max_position_m: [0.5, 0.5, 0.5]}}
      # the full stop runs only when the bounds check fails, so it sits under a fallback
      - node: {node_id: kernel.full_stop, ancestor: pick_and_place, ancestor_node_id: fallback}
      - subtree_order: {root: pick_and_place,
                        order: [{node_id: scene.get_object_pose}, {node_id: geometry.check_pose_bounds},
                                move_to_pick_approach]}
    unchanged: true
    allow_new_node_ids: [sequence, fallback, inverter]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_reset_sim_between_cycles
  category: n2_task
  detail_level: medium
  scenario: sim
  intent: "Run the Isaac cycle 5 times with the simulation reset between cycles."
  prompt: run the cycle 5 times and reset the simulation between cycles
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # reset_simulation already ends every cycle; the repeat around the root is the needed change.
      - node: {node_id: repeat, parent: null, parameters: {num_cycles: 5}, children_node_ids: [sequence]}
      - node: {instance_id: isaac_light_cycle, parent_node_id: repeat}
      - node: {instance_id: reset_simulation, parent: isaac_light_cycle}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_mute_scanner_while_feeding
  category: n2_task
  detail_level: specific
  intent: "Mute the area-scanner rule while the operator feeds parts, and re-arm it before any motion."
  prompt: parts are fed through the scanner zone while the robot waits, so at the start of the cycle turn the zone_intrusion rule off, wait for the operator to press the start button, then turn the rule back on before the robot moves
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: rules.set_active, ancestor: pick_and_place, parameters: {rule_id: zone_intrusion, active: false}}
      - node: {node_id: io.wait_for_input, ancestor: pick_and_place,
               parameters: {signal.component_id: cell_io, signal.signal_name: start_button, expected_value: true}}
      - node: {node_id: rules.set_active, ancestor: pick_and_place, parameters: {rule_id: zone_intrusion, active: true}}
      - subtree_order:
          root: pick_and_place
          order: [{node_id: rules.set_active, parameters: {active: false}}, {node_id: io.wait_for_input},
                  {node_id: rules.set_active, parameters: {active: true}}, command_gripper]
    unchanged: true
    allow_new_node_ids: [sequence]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_probe_fixture_surface
  category: n2_task
  detail_level: specific
  intent: "Find the drop fixture surface with the touch probe and record the TCP pose there."
  prompt: use the touch probe to find the drop fixture surface - after move_to_drop_approach, move the UR10e slowly down toward (0.3, 0.3, 0.0) in its base frame until touch_probe on cell_io turns on, stopping softly on the path, then store the gripper TCP pose in a new key fixture_touch_pose
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # "slowly" is open (velocity_scale or a TCP speed cap); the goal orientation is open too.
      - blackboard_key: {key: fixture_touch_pose, present: true, type: stored_pose}
      - node: {node_id: motion.move_until_signal, parent: pick_and_place, after: move_to_drop_approach,
               parameters: {target.component_id: ur10e_robot, goal.position_m: [0.3, 0.3, 0.0], stop_mode: soft_on_path,
                            interrupt_condition.compare.operand.signal.signal_name: touch_probe,
                            interrupt_condition.compare.value: true}}
      - node: {node_id: model.get_frame_pose, parent: pick_and_place,
               parameters: {frame.component_id: robotiq_2f_140, output_key: fixture_touch_pose}}
      - subtree_order: {root: pick_and_place,
                        order: [{node_id: motion.move_until_signal}, {node_id: model.get_frame_pose}, move_to_drop]}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_alarm_on_pick_failure
  category: n2_task
  detail_level: medium
  intent: "If the approach, descent or grasp fails, light the alarm and full-stop the cell."
  prompt: if any part of the pick (approach, descent or closing the gripper) fails, turn the alarm light on and do a full stop of the cell
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {instance_id: move_to_pick_approach, ancestor_node_id: fallback}
      - node: {instance_id: move_to_pick, ancestor_node_id: fallback}
      - node: {instance_id: close_gripper, ancestor_node_id: fallback}
      - node: {node_id: io.set_output, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: alarm_light, value: true}}
      - node: {node_id: kernel.full_stop, ancestor_node_id: fallback}
      - subtree_order: {root: pick_and_place,
                        order: [command_gripper, move_to_pick_approach, move_to_pick, close_gripper, attach_graspable]}
      - subtree_order: {root: pick_and_place, order: [{node_id: io.set_output}, {node_id: kernel.full_stop}]}
    unchanged: true
    # one fallback around the three steps, or one per step (each with its own alarm + stop), are both fine
    allow_new_node_ids: [sequence, fallback, io.set_output, kernel.full_stop]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_ready_light
  category: n2_task
  detail_level: medium
  intent: "The green ready light is off during the cycle and on again once the robot is at rest."
  prompt: turn the green ready light off while the cycle runs and back on when the robot is back at rest
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.set_output, parent: pick_and_place, index: 0,
               parameters: {signal.component_id: cell_io, signal.signal_name: ready_light, value: false}}
      - node: {node_id: io.set_output, parent: pick_and_place, after: return_rest, last_child: true,
               parameters: {signal.component_id: cell_io, signal.signal_name: ready_light, value: true}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_plan_or_alarm
  category: n2_task
  detail_level: specific
  intent: "Plan the pick first; when no plan is feasible, light the alarm and full-stop instead of pausing."
  prompt: before the robot moves, plan the pick of graspable (UR10e arm, Robotiq gripper closing to its closed preset, carried on the Robotiq tcp frame, contact policy grasp_contact, plan stored in a new key pick_plan); if no plan is feasible, turn the alarm light on and do a full stop instead of pausing for the operator
  preconditions:
    fixtures: *grasp_contact_fixtures
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: pick_plan, present: true, type: pick_planning_result}
      - node: {node_id: planning.plan_pick_sequence, ancestor: pick_and_place, ancestor_node_id: fallback,
               parameters: {selected_object_id: graspable, contact_policy_id: grasp_contact, output_key: pick_plan,
                            no_feasible_plan_policy: condition_failure}}
      - node: {node_id: io.set_output, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: alarm_light, value: true}}
      - node: {node_id: kernel.full_stop, ancestor_node_id: fallback}
      - subtree_order: {root: pick_and_place,
                        order: [{node_id: planning.plan_pick_sequence}, {node_id: io.set_output},
                                {node_id: kernel.full_stop}, move_to_pick_approach]}
    unchanged: true
    allow_new_node_ids: [sequence, fallback]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_clamp_release
  category: n2_task
  detail_level: specific
  intent: "After the part is released, open the fixture clamp and wait up to 2 s for the pressure to drop."
  prompt: after detach_graspable, release the fixture clamp and wait up to 2 seconds until the clamp pressure switch shows no pressure
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.set_output, parent: pick_and_place, after: detach_graspable,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_valve, value: false}}
      - node: {node_id: io.wait_for_input, parent: pick_and_place, before: drop_retreat,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_pressure_ok, expected_value: false,
                            timeout_s: 2.0}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
