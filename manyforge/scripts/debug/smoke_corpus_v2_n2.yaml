# ---------------------------------------------------------------- geometry ----------------------------------
- id: N2_GEOM_offset_pose_specific
  category: n2_geometry
  detail_level: specific
  intent: "Compute a pose 5 cm along the z axis of the stored pick pose into a new key."
  prompt: after command_gripper, offset the pose in pick_pose by 5 cm along its z axis with no rotation and store the result in a new key above_pick_pose
  preconditions:
    fixtures:
    - tool: blackboard_draft_upsert_keys
      arguments:
        keys:
        - key: pick_pose
          type: stored_pose
          access: read_write
          persistence: run
          description: Seed blackboard key inserted by the smoke harness.
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: above_pick_pose, present: true, type: stored_pose}
      - node: {node_id: geometry.offset_pose, parent: pick_and_place, after: command_gripper,
               value_sources: {pose: {kind: blackboard_key, reference: pick_pose}},
               parameters: {offset.position_m: [0.0, 0.0, 0.05], offset.rpy_deg: [0.0, 0.0, 0.0],
                            output_key: above_pick_pose}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_GEOM_check_pose_bounds_specific
  category: n2_geometry
  detail_level: specific
