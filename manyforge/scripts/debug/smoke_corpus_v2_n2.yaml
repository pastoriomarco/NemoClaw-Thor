# ================================================================ operator tasks ============================
- id: N2_TASK_part_gate_alarm
  category: n2_task
  detail_level: medium
  intent: "Pick only when a part is present: wait up to 10 s for the part sensor, otherwise raise the alarm instead of picking."
  prompt: only pick if the part sensor sees a part; otherwise wait up to 10 s for one, and if none arrives, raise the alarm output instead of picking
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.wait_for_input, ancestor: pick_and_place, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true,
                            timeout_s: 10.0}}
      - node: {node_id: io.set_output, ancestor: pick_and_place, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: alarm_light, value: true}}
      - subtree_order: {root: pick_and_place,
                        order: [{node_id: io.wait_for_input}, {node_id: io.set_output}, move_to_pick_approach]}
    # Whether the alarm branch then ends the cycle (no pick) is part of the intent; with the free structure
    # it is judged from the answer and the evidence review, not by a static check.
    unchanged: true
    allow_new_node_ids: [sequence, fallback, inverter, io.check_input, logic.check_condition, kernel.full_stop,
                         kernel.stop_operation]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_clamp_retry
  category: n2_task
  detail_level: medium
  intent: "Clamp the part at the drop fixture and confirm the clamp pressure, retrying the clamp step once."
  prompt: 'at the drop, right before open_gripper: switch the clamp valve on, then check the clamp pressure switch; if the pressure is not ok, try once more'
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # "try once more" = 2 attempts in total (retry.num_attempts counts total child runs)
      - node: {node_id: retry, parent: pick_and_place, before: open_gripper, parameters: {num_attempts: 2}}
      - node: {node_id: io.set_output, ancestor_node_id: retry,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_valve, value: true}}
      - node: {node_id: [io.check_input, io.wait_for_input], ancestor_node_id: retry,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_pressure_ok, expected_value: true}}
      - subtree_order: {root_node_id: retry, order: [{node_id: io.set_output}, {node_id: [io.check_input, io.wait_for_input]}]}
    unchanged: true
    allow_new_node_ids: [sequence, timer]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_slow_final_approach
  category: n2_task
  detail_level: medium
  intent: "Run only the final descent to the pick at 30% speed; the other moves keep their speed."
  prompt: slow down to 30% for the final approach to the pick
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {instance_id: move_to_pick, effective_parameters: {velocity_scale: 0.3}}
      - node: {instance_id: move_to_pick_approach, value_sources: {velocity_scale: {kind: program_parameter, reference: velocity_scale}}}
      - parameter: {id: velocity_scale, present: true, default: 0.5}
      # a new float64 parameter (default 0.3) bound to move_to_pick is fine too; first alternative wins
      - any_of:
          - - parameter: {present: true, type: float64, default: 0.3}
          - []
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_straight_line_drop
  category: n2_task
  detail_level: medium
  intent: "The descent from the drop approach to the drop pose becomes a straight-line Cartesian move."
  prompt: make the move down to the drop a straight-line move
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # The Cartesian path takes the place of move_to_drop (immediately between the approach and
      # open_gripper, so no joint-space move_to_pose remains there) and ends at the drop pose
      # (0.3, 0.3, 0.05) in the base frame, stated absolutely or relative to that pose.
      - node: {node_id: motion.follow_cartesian_path, parent: pick_and_place, after: move_to_drop_approach,
               before: open_gripper}
      # move_to_drop is removed, or kept as the same instance with its kind changed
      - any_of:
          - - node_absent: {instance_id: move_to_drop}
          - - node: {instance_id: move_to_drop, node_id: motion.follow_cartesian_path}
      - any_of:
          - - node: {node_id: motion.follow_cartesian_path, parameters: {'path[-1].position_m': [0.3, 0.3, 0.05]}}
          - - node: {node_id: motion.follow_cartesian_path,
                     parameters: {target_mode: relative, target_reference.pose.position_m: [0.3, 0.3, 0.05],
                                  'path[-1].position_m': [0.0, 0.0, 0.0]}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_offset_pick_up_5cm
  category: n2_task
  detail_level: medium
  intent: "Raise the grasp point 5 cm above its current relative offset from graspable."
  prompt: offset the pick pose 5 cm up
  preconditions: {}
  outcome:
