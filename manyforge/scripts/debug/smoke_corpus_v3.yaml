- id: N2_TASK_part_gate_alarm
  category: n2_task
  detail_level: medium
  intent: "Pick only when a part is present: wait up to 10 s for the part sensor, otherwise raise the alarm instead of picking."
  prompt: only pick if the part sensor sees a part; otherwise wait up to 10 s for one, and if none arrives, raise the alarm output instead of picking
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.wait_for_input, ancestor: pick_and_place, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true,
                            timeout_s: 10.0}}
      - node: {node_id: io.set_output, ancestor: pick_and_place, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: alarm_light, value: true}}
      # v3 (T1, BT semantics): "instead of picking" means the alarm branch must end the cycle: either
      # [alarm, full stop] in a sequence directly under the fallback, or an inverted alarm (the fallback fails).
      - any_of:
          - - node: {node_id: sequence, parent_node_id: fallback, children_node_ids: [io.set_output, kernel.full_stop]}
            - subtree_order: {root: pick_and_place,
                              order: [{node_id: io.wait_for_input}, {node_id: io.set_output}, {node_id: kernel.full_stop},
                                      move_to_pick_approach]}
          - - node: {node_id: inverter, parent_node_id: fallback, children_node_ids: [io.set_output]}
            - subtree_order: {root: pick_and_place,
                              order: [{node_id: io.wait_for_input}, {node_id: io.set_output}, move_to_pick_approach]}
    unchanged: true
    allow_new_node_ids: [sequence, fallback, inverter, io.check_input, logic.check_condition, kernel.full_stop,
                         kernel.stop_operation]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_clamp_retry
  category: n2_task
  detail_level: medium
  intent: "Clamp the part at the drop fixture and confirm the clamp pressure, retrying the clamp step once."
  prompt: 'at the drop, right before open_gripper: switch the clamp valve on, then check the clamp pressure switch; if the pressure is not ok, try once more'
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # 2026-11-10, from the Mock run-time behaviour: clamp_pressure_ok echoes clamp_valve 300 ms later
      # (deployment cell_io: echo delay_ms 300), and a retry re-runs its child at once. So an io.check_input
      # right after the valve command reads false on both attempts; it works only after a timer longer
      # than 0.3 s. Accepted (all after move_to_drop, before open_gripper, valve on first):
      #   A  retry (2 attempts in total) around a wait for the pressure with a timeout > 0.3 s, with the
      #      valve command inside the retry or before it (retrying the whole step, or only the check);
      #   B  check_input under a retry (2) after a timer > 0.3 s that follows the valve command;
      #   C  one timed wait for the pressure (timeout > 0.3 s) with no retry: the wait itself re-checks.
      # A wait without a timeout never gives up, so it is not accepted.
      - node: {node_id: io.set_output, ancestor: pick_and_place,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_valve, value: true}}
      - any_of:
          - - node: {node_id: retry, ancestor: pick_and_place, parameters: {num_attempts: 2}}
            - node: {node_id: io.wait_for_input, ancestor_node_id: retry,
                     parameters: {signal.component_id: cell_io, signal.signal_name: clamp_pressure_ok, expected_value: true,
                                  timeout_s: {min_exclusive: 0.3}}}
            - subtree_order: {root: pick_and_place, order: [move_to_drop, {node_id: io.set_output}, {node_id: io.wait_for_input},
                                                             open_gripper]}
          - - node: {node_id: retry, ancestor: pick_and_place, parameters: {num_attempts: 2}}
            - node: {node_id: io.check_input, ancestor_node_id: retry,
                     parameters: {signal.component_id: cell_io, signal.signal_name: clamp_pressure_ok, expected_value: true}}
            - node: {node_id: timer, ancestor: pick_and_place, parameters: {duration_s: {min_exclusive: 0.3}}}
            - subtree_order: {root: pick_and_place, order: [move_to_drop, {node_id: io.set_output}, {node_id: timer},
                                                             {node_id: io.check_input}, open_gripper]}
          - - node: {node_id: io.wait_for_input, ancestor: pick_and_place,
                     parameters: {signal.component_id: cell_io, signal.signal_name: clamp_pressure_ok, expected_value: true,
                                  timeout_s: {min_exclusive: 0.3}}}
            - subtree_order: {root: pick_and_place, order: [move_to_drop, {node_id: io.set_output}, {node_id: io.wait_for_input},
                                                             open_gripper]}
    unchanged: true
    allow_new_node_ids: [sequence, timer]
    diagnostics: no_new_errors
    answer: {consistent: true}
    repair:
    - {"tool": "tree_draft_insert_node", "arguments": {"before_instance_id": "open_gripper", "node": {"node_id": "retry", "instance_id": "clamp_retry", "parameters": {"num_attempts": 2}, "children": [{"node_id": "sequence", "instance_id": "clamp_step", "parameters": {}, "children": [{"node_id": "io.set_output", "instance_id": "clamp_valve_on", "parameters": {"signal": {"component_id": "cell_io", "signal_name": "clamp_valve"}, "value": true}, "children": []}, {"node_id": "io.wait_for_input", "instance_id": "clamp_pressure_wait", "parameters": {"signal": {"component_id": "cell_io", "signal_name": "clamp_pressure_ok"}, "expected_value": true, "timeout_s": 1.0}, "children": []}]}]}}}

