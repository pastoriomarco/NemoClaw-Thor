- id: N2_PLAN_place_execute_specific
  category: n2_planning
  detail_level: specific
  intent: "Plan placing graspable at the drop pose, then run the planned approach, descend, gripper open, detach and retreat before return_rest."
  prompt: 'after pick_retreat, plan placing graspable at (0.3, 0.3, 0.05) in the UR10e base frame with the tool pointing down (rpy 180, 0, -180), for the UR10e arm with the Robotiq gripper opening to its open preset, carried on the Robotiq tcp frame, and store the plan in a new key place_plan; then execute the planned place: move to the planned approach pose, descend along the planned descend path, open the gripper, detach graspable, and retreat along the planned retreat path'
  preconditions:
    fixtures: &planned_place_fixtures
    # the taught drop goes; the taught pick and return_rest stay
    - {tool: tree_draft_delete_node, arguments: {instance_id: move_to_drop_approach}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: move_to_drop}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: open_gripper}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: detach_graspable}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: drop_retreat}}
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: place_plan, present: true, type: pick_planning_result}
      - node: {node_id: planning.plan_place_sequence, parent: pick_and_place, after: pick_retreat,
               parameters: {target.component_id: ur10e_robot, target.command_target_id: arm,
                            base_frame.component_id: ur10e_robot, base_frame.frame_id: base,
                            tool_target.component_id: robotiq_2f_140,
                            carrier_frame_ref.component_id: robotiq_2f_140, carrier_frame_ref.frame_id: tcp,
                            selected_object_id: graspable, output_key: place_plan,
                            place_pose.position_m: [0.3, 0.3, 0.05], place_pose.orientation.rpy_deg: [180.0, 0.0, -180.0]}}
      - any_of:
          - - node: {node_id: planning.plan_place_sequence, parameters: {tool_position.kind: named_preset, tool_position.name: open}}
          - - node: {node_id: planning.plan_place_sequence, parameters: {tool_position.kind: angular_rad, tool_position.value_rad: 0.0}}
      - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
               value_sources: {goal: {kind: blackboard_field, reference: place_plan, field: approach_pose}}}
      - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place,
               value_sources: {path: {kind: blackboard_field, reference: place_plan, field: descend_path}}}
      - any_of:
          - - node: {node_id: scene.detach_carried_object, ancestor: pick_and_place, parameters: {scene_resource_id: graspable}}
          - - node: {node_id: scene.detach_carried_object, ancestor: pick_and_place,
                     value_sources: {scene_resource_id: {kind: blackboard_field, reference: place_plan, field: selected_object_id}}}
      # the open sits right next to the detach (either order); literal open or the plan's tool_position
      - any_of:
          - - node: {node_id: gripper.command_position, before: scene.detach_carried_object,
                     value_sources: {position: {kind: blackboard_field, reference: place_plan, field: tool_position}}}
          - - node: {node_id: gripper.command_position, after: scene.detach_carried_object,
                     value_sources: {position: {kind: blackboard_field, reference: place_plan, field: tool_position}}}
          - - node: {node_id: gripper.command_position, before: scene.detach_carried_object,
                     parameters: {position.kind: named_preset, position.name: open}}
          - - node: {node_id: gripper.command_position, after: scene.detach_carried_object,
                     parameters: {position.kind: named_preset, position.name: open}}
          - - node: {node_id: gripper.command_position, before: scene.detach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.0}}
          - - node: {node_id: gripper.command_position, after: scene.detach_carried_object,
