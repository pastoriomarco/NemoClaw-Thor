- id: N2_PLAN_place_on_runtime_tray_specific
  category: n2_planning
  detail_level: specific
  intent: "A tray appears after the pick; the Program adds it to the runtime scene, then plans the place of graspable with the tray present."
  prompt: 'after pick_retreat, a 0.2 x 0.2 x 0.02 m tray named place_tray is put down at (0.3, 0.3, 0.01) in the cell frame: add it to the scene at that point, then plan (without moving) placing graspable at (0.3, 0.3, 0.05) in the UR10e base frame with the tool pointing down (rpy 180, 0, -180), for the UR10e arm with the Robotiq gripper opening to its open preset, carried on the Robotiq tcp frame, and store the plan in a new key place_plan'
