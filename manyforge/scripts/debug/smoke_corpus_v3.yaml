      - node: {node_id: fallback, parent: pick_and_place, before: close_gripper,
               children_node_ids: [motion.move_to_pose, motion.move_to_pose]}
      # move_to_pick first (or its equal-content copy, renamed_equivalent)
      - node: {instance_id: move_to_pick, parent_node_id: fallback, index: 0}
      # the same move 2 cm higher (move_to_pick goal z = 0.025 above graspable), other values as move_to_pick
      - node: {node_id: motion.move_to_pose, parent_node_id: fallback, index: 1,
               parameters: {target_mode: relative, target_reference.scene_resource_id: graspable,
                            "goal.position_m[0]": 0.0, "goal.position_m[1]": 0.0,
                            "goal.position_m[2]": {min_inclusive: 0.043, max_inclusive: 0.047},
                            goal.orientation.rpy_deg: [180.0, 0.0, -180.0]}}
    # nodes moved into the new fallback (move_to_pick) count as matched for 'unchanged'.
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: FALLBACK_generic
  category: tree_insert_fallback
  detail_level: generic
  intent: The operator wants a fallback node added, with no children or location given.
  prompt: add a fallback
  outcome:
    # v2: asking is valid. 2026-11-10: the result must be what the scripted answer gives (position and
    # children, in this order), so an empty or guessed fallback no longer passes. "Check that the gripper
    # reached its target": a single read (check_status) or a wait for it (wait_for_status).
    clarify: allowed
    clarification_answer: "At the end of pick_and_place: first check that the gripper reached its target; if that fails, wait 1 second."
    draft:
      - node: {node_id: fallback, parent: pick_and_place, last_child: true,
               children_node_ids: [[gripper.check_status, gripper.wait_for_status], timer]}
      - node: {node_id: [gripper.check_status, gripper.wait_for_status], parent_node_id: fallback, index: 0,
               parameters: {target.component_id: robotiq_2f_140, expected_state: reached}}
      - node: {node_id: timer, parent_node_id: fallback, index: 1, parameters: {duration_s: 1.0}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: UPDATE_params_specific
  category: tree_update_node_params
  detail_level: specific
  intent: The operator wants the speed of the move_to_pick_approach motion set to 0.3, for that node.
  prompt: set the move_to_pick_approach node's velocity_scale parameter to 0.3
  outcome:
    clarify: none
    draft:
      # v2: the prompt names this node's velocity_scale, and the motion nodes bind it to the Program
      # parameter velocity_scale. Only this node must change, so the effective value on it is 0.3
      # (a literal replacing the binding) while the other motion nodes stay bound and the
      # parameter keeps its default. Changing the Program parameter would slow every move: fails.
      - node: {instance_id: move_to_pick_approach, effective_parameters: {velocity_scale: 0.3}}
      # merge: dropped the value_sources check on move_to_pick; unchanged: true already requires it to stay bound.
      - parameter: {id: velocity_scale, present: true, default: 0.5}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: UPDATE_params_medium
  category: tree_update_node_params
  detail_level: medium
  intent: The operator wants move_to_pick_approach to run at half its current speed.
  prompt: slow down move_to_pick_approach by half
  outcome:
    clarify: none
    draft:
      # v2: current speed of this node is the Program parameter (0.5), so half is 0.25, on this node only.
      - node: {instance_id: move_to_pick_approach, effective_parameters: {velocity_scale: 0.25}}
      # merge: dropped the value_sources check on move_to_pick; unchanged: true already requires it to stay bound.
      - parameter: {id: velocity_scale, present: true, default: 0.5}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: UPDATE_params_generic
  category: tree_update_node_params
  detail_level: generic
  intent: The operator wants the robot to move slower overall.
  prompt: make the robot move slower
  outcome:
    # v2: vague but answerable. In this Program all moves share the velocity_scale parameter, so
    # "the robot moves slower" most naturally lowers it. Either lowering the parameter default or
    # lowering the effective speed of every motion node is accepted. A question is accepted too.
    clarify: allowed
    clarification_answer: "All the motions, down to a quarter of the maximum speed."
    draft:
      - any_of:
          - - parameter: {id: velocity_scale, present: true, default: {max_exclusive: 0.5}}
          # merge: all_nodes rewritten as one node check per motion node (same intent).
          - - node: {instance_id: move_to_pick_approach, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
            - node: {instance_id: move_to_pick, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
            - node: {instance_id: pick_retreat, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
            - node: {instance_id: move_to_drop_approach, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
            - node: {instance_id: move_to_drop, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
            - node: {instance_id: drop_retreat, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
            - node: {instance_id: return_rest, effective_parameters: {velocity_scale: {max_exclusive: 0.5}}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
- id: DELETE_named_specific
