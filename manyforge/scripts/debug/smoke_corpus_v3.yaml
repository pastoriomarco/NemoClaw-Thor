  prompt: make sure the part is where we taught it before picking
  preconditions:
    fixtures: *two_pose_fixture
  outcome:
    clarify: allowed
    clarification_answer: Compare graspable_pose with taught_pick_pose, within 1 cm and 3 degrees, right before move_to_pick_approach.
    draft:
      - any_of:
          - - node: {node_id: geometry.check_pose_distance, ancestor: pick_and_place,
                     parameters: {pose_key_a: graspable_pose, pose_key_b: taught_pick_pose}}
          - - node: {node_id: geometry.check_pose_distance, ancestor: pick_and_place,
                     parameters: {pose_key_a: taught_pick_pose, pose_key_b: graspable_pose}}
          # v3c: the part's pose read into another key, compared with the taught pose
          - - node: {node_id: geometry.check_pose_distance, ancestor: pick_and_place,
                     parameters: {pose_key_b: taught_pick_pose}}
          - - node: {node_id: geometry.check_pose_distance, ancestor: pick_and_place,
                     parameters: {pose_key_a: taught_pick_pose}}
      # v3d: a step that reads the part's pose for that comparison is allowed
      - any_of:
          - - node: {node_id: scene.get_object_pose, ancestor: pick_and_place,
                     parameters: {scene_resource_id: graspable}}
          - []
      # v3g: ... and a sequence grouping the read and the check
