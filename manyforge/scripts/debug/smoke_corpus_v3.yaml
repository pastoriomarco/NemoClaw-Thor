  category: n2_task
  detail_level: specific
  intent: "Plan the pick first; when no plan is feasible, light the alarm and full-stop instead of pausing."
  prompt: before the robot moves, plan the pick of graspable (UR10e arm, Robotiq gripper closing to its closed preset, carried on the Robotiq tcp frame, contact policy grasp_contact, plan stored in a new key pick_plan); if no plan is feasible, turn the alarm light on and do a full stop instead of pausing for the operator
  preconditions:
    fixtures: *grasp_contact_fixtures
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: pick_plan, present: true, type: pick_planning_result}
      - node: {node_id: planning.plan_pick_sequence, ancestor: pick_and_place, ancestor_node_id: fallback,
               parameters: {selected_object_id: graspable, contact_policy_id: grasp_contact, output_key: pick_plan,
                            no_feasible_plan_policy: condition_failure}}
      - node: {node_id: io.set_output, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: alarm_light, value: true}}
      - node: {node_id: kernel.full_stop, ancestor_node_id: fallback}
      - subtree_order: {root: pick_and_place,
                        order: [{node_id: planning.plan_pick_sequence}, {node_id: io.set_output},
                                {node_id: kernel.full_stop}, move_to_pick_approach]}
      # v3 (T1, BT semantics): the alarm branch is a fallback alternative that ends the cycle: exactly
      # [alarm, full stop] in a sequence directly under a fallback (a bare alarm would succeed and let the pick run).
      - node: {node_id: sequence, parent_node_id: fallback, children_node_ids: [io.set_output, kernel.full_stop]}
    unchanged: true
    allow_new_node_ids: [sequence, fallback]
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: N2_TASK_clamp_release
  category: n2_task
  detail_level: specific
  intent: "After the part is released, open the fixture clamp and wait up to 2 s for the pressure to drop."
  prompt: after detach_graspable, release the fixture clamp and wait up to 2 seconds until the clamp pressure switch shows no pressure
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {node_id: io.set_output, parent: pick_and_place, after: detach_graspable,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_valve, value: false}}
      - node: {node_id: io.wait_for_input, parent: pick_and_place, before: drop_retreat,
               parameters: {signal.component_id: cell_io, signal.signal_name: clamp_pressure_ok, expected_value: false,
                            timeout_s: 2.0}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ================================================================ planned pick/place + runtime scene (2026-11-10) ====
# Maintainer decision 2026-11-10: the chat may insert planning.plan_*_sequence nodes. These cases ask for a plan
# AND its execution, or combine a plan with the Program's own motion and scene nodes; the plan-only cases are
# N2_PLAN_* above. The corpus Scenario offers both plan nodes (all their capabilities are in the Mock
# Deployment; live prompt evidence: docs/smoke-evidence/2026-11-09-catalog-projection/od85-live-system-prompt.txt).
#
# Executing a plan = ordinary nodes whose values come from the plan's pick_planning_result key (blackboard_field
# value sources; fields approach_pose, descend_path, pick_pose, retreat_path, retreat_pose, selected_object_id,
# tool_position; pick_pose is the end of descend_path, retreat_pose the end of retreat_path). Every valid way
# to run a leg is accepted, not one shape:
#   approach  motion.move_to_pose, goal <- approach_pose
#   descend   motion.follow_cartesian_path, path <- descend_path, or motion.move_to_pose, goal <- pick_pose
#             (pick: under the plan's contact policy, which the plan validated the descend with)
#   gripper   gripper.command_position, position <- tool_position, or the literal closed/open position
#   attach/detach  scene_resource_id graspable, or <- selected_object_id, or the fixture key pick_target
#   retreat   motion.follow_cartesian_path, path <- retreat_path, or motion.move_to_pose, goal <- retreat_pose
# Flat in pick_and_place or grouped in a new sequence (allow_new_node_ids: sequence). Ordering: plan, approach,
# descend, (gripper and attach/detach, adjacent, either order), retreat, then the Program's next taught step.
# The key's name is checked only where the prompt names it. Key fields: the golden declares all seven fields;
# the checks do not (a missing field a value source needs shows up as a diagnostic).
# Goldens are the `repair` lists (applied only for chain cases by the runner; here they are the reference edit).
# Pick cases need a contact policy (plan_pick_sequence.contact_policy_id is required): the fixtures add
# grasp_contact as in N2_MOTION_probe_search_specific, so these cases test the pick itself. The model declares
# the policy itself only in N2_PLAN_pick_sequence_declare_policy_specific.

- id: N2_PLAN_pick_execute_specific
  category: n2_planning
  detail_level: specific
  intent: "Plan the pick of graspable, then run the planned approach, descend, gripper close, attach and retreat before the taught drop."
  prompt: 'after command_gripper, plan the pick of graspable for the UR10e arm in its base frame with the Robotiq gripper closing to its closed preset, carried on the Robotiq tcp frame, with contact policy grasp_contact, and store the plan in a new key pick_plan; then execute the planned pick: move to the planned approach pose, descend along the planned descend path under grasp_contact, close the gripper, attach graspable to the gripper, and retreat along the planned retreat path'
  preconditions:
    fixtures: &planned_pick_fixtures
    - tool: blackboard_draft_upsert_keys
      arguments:
        keys:
        - key: pick_target
          type: scene_resource
          access: read_write
          persistence: run
          initial: graspable
          description: Seed blackboard key inserted by the smoke harness.
    - tool: program_draft_upsert_contact_policies
      arguments:
        contact_policies:
        - api_version: manyforge.contact_policy.v1
          policy_id: grasp_contact
          mode: contact_grasp
          sensing_mode: geometry_only
          default_unmatched_response: hard_stop
          zones:
          - zone_id: fingertips
            body_pairs:
            - body_a: {kind: motion_endpoint}
              body_b: {kind: runtime_object, runtime_object_id: pick_target}
            max_penetration_m: 0.002
            terminal_window_start_fraction: 0.8
            violation_response: hard_stop
    # the taught pick goes; command_gripper (open) and the taught drop stay
    - {tool: tree_draft_delete_node, arguments: {instance_id: move_to_pick_approach}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: move_to_pick}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: close_gripper}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: attach_graspable}}
    - {tool: tree_draft_delete_node, arguments: {instance_id: pick_retreat}}
  outcome:
    clarify: none
    draft:
      - blackboard_key: {key: pick_plan, present: true, type: pick_planning_result}
      - node: {node_id: planning.plan_pick_sequence, parent: pick_and_place, after: command_gripper,
               parameters: {target.component_id: ur10e_robot, target.command_target_id: arm,
                            base_frame.component_id: ur10e_robot, base_frame.frame_id: base,
                            tool_target.component_id: robotiq_2f_140,
                            carrier_frame_ref.component_id: robotiq_2f_140, carrier_frame_ref.frame_id: tcp,
                            selected_object_id: graspable, contact_policy_id: grasp_contact, output_key: pick_plan}}
      - any_of:
          - - node: {node_id: planning.plan_pick_sequence, parameters: {tool_position.kind: named_preset, tool_position.name: closed}}
          - - node: {node_id: planning.plan_pick_sequence, parameters: {tool_position.kind: angular_rad, tool_position.value_rad: 0.66}}
      - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
               value_sources: {goal: {kind: blackboard_field, reference: pick_plan, field: approach_pose}}}
      # "along the planned descend path": the Cartesian path, under the contact policy
      - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place, parameters: {contact_policy_id: grasp_contact},
               value_sources: {path: {kind: blackboard_field, reference: pick_plan, field: descend_path}}}
      - any_of:
          - - node: {node_id: scene.attach_carried_object, ancestor: pick_and_place, parameters: {scene_resource_id: graspable}}
          - - node: {node_id: scene.attach_carried_object, ancestor: pick_and_place,
                     value_sources: {scene_resource_id: {kind: blackboard_field, reference: pick_plan, field: selected_object_id}}}
      # the close sits right next to the attach (either order); literal closed or the plan's tool_position
      - any_of:
          - - node: {node_id: gripper.command_position, before: scene.attach_carried_object,
                     value_sources: {position: {kind: blackboard_field, reference: pick_plan, field: tool_position}}}
          - - node: {node_id: gripper.command_position, after: scene.attach_carried_object,
                     value_sources: {position: {kind: blackboard_field, reference: pick_plan, field: tool_position}}}
          - - node: {node_id: gripper.command_position, before: scene.attach_carried_object,
                     parameters: {position.kind: named_preset, position.name: closed}}
          - - node: {node_id: gripper.command_position, after: scene.attach_carried_object,
                     parameters: {position.kind: named_preset, position.name: closed}}
          - - node: {node_id: gripper.command_position, before: scene.attach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.66}}
          - - node: {node_id: gripper.command_position, after: scene.attach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.66}}
      - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place,
               value_sources: {path: {kind: blackboard_field, reference: pick_plan, field: retreat_path}}}
      - subtree_order:
          root: pick_and_place
          order:
            - command_gripper
            - {node_id: planning.plan_pick_sequence}
            - {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}}
            - {node_id: motion.follow_cartesian_path, value_sources: {path: {kind: blackboard_field, field: descend_path}}}
            - {node_id: scene.attach_carried_object}
            - {node_id: motion.follow_cartesian_path, value_sources: {path: {kind: blackboard_field, field: retreat_path}}}
            - move_to_drop_approach
    unchanged: true
    allow_new_node_ids: [sequence]
    diagnostics: no_new_errors
    answer: {consistent: true}
    repair: &planned_pick_golden
    - {"tool": "blackboard_draft_upsert_keys", "arguments": {"keys": [{"key": "pick_plan", "type": "pick_planning_result", "access": "read_write", "persistence": "run", "description": "Planned pick of graspable.", "fields": [{"field": "approach_pose", "type": "stored_pose"}, {"field": "descend_path", "type": "cartesian_path"}, {"field": "pick_pose", "type": "stored_pose"}, {"field": "retreat_path", "type": "cartesian_path"}, {"field": "retreat_pose", "type": "stored_pose"}, {"field": "selected_object_id", "type": "scene_resource"}, {"field": "tool_position", "type": "coordinate_position"}]}]}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "command_gripper", "node": {"node_id": "planning.plan_pick_sequence", "instance_id": "plan_pick", "parameters": {"target": {"component_id": "ur10e_robot", "command_target_id": "arm"}, "tool_target": {"component_id": "robotiq_2f_140", "command_target_id": "gripper"}, "base_frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "carrier_frame_ref": {"component_id": "robotiq_2f_140", "frame_id": "tcp"}, "selected_object_id": "graspable", "tool_position": {"kind": "named_preset", "name": "closed"}, "contact_policy_id": "grasp_contact", "output_key": "pick_plan"}, "children": []}}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "plan_pick", "node": {"node_id": "motion.move_to_pose", "instance_id": "planned_pick_approach", "parameters": {"target": {"component_id": "ur10e_robot", "command_target_id": "arm"}, "base_frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "tcp_endpoint": {"kind": "current"}}, "value_sources": {"goal": {"kind": "blackboard_field", "reference": "pick_plan", "field": "approach_pose"}}, "children": []}}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "planned_pick_approach", "node": {"node_id": "motion.follow_cartesian_path", "instance_id": "planned_pick_descend", "parameters": {"target": {"component_id": "ur10e_robot", "command_target_id": "arm"}, "base_frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "tcp_endpoint": {"kind": "current"}, "contact_policy_id": "grasp_contact", "contact_scene_resource_id": "graspable"}, "value_sources": {"path": {"kind": "blackboard_field", "reference": "pick_plan", "field": "descend_path"}}, "children": []}}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "planned_pick_descend", "node": {"node_id": "gripper.command_position", "instance_id": "planned_pick_close", "parameters": {"target": {"component_id": "robotiq_2f_140", "command_target_id": "gripper"}}, "value_sources": {"position": {"kind": "blackboard_field", "reference": "pick_plan", "field": "tool_position"}}, "children": []}}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "planned_pick_close", "node": {"node_id": "scene.attach_carried_object", "instance_id": "planned_pick_attach", "parameters": {"target": {"component_id": "robotiq_2f_140", "command_target_id": "gripper"}, "carrier_frame_ref": {"component_id": "robotiq_2f_140", "frame_id": "tcp"}, "touch_bodies": [{"component_id": "robotiq_2f_140", "collision_body_id": "gripper_collision"}], "scene_resource_id": "graspable"}, "children": []}}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "planned_pick_attach", "node": {"node_id": "motion.follow_cartesian_path", "instance_id": "planned_pick_retreat", "parameters": {"target": {"component_id": "ur10e_robot", "command_target_id": "arm"}, "base_frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "tcp_endpoint": {"kind": "current"}}, "value_sources": {"path": {"kind": "blackboard_field", "reference": "pick_plan", "field": "retreat_path"}}, "children": []}}}

- id: N2_PLAN_pick_execute_medium
  category: n2_planning
  detail_level: medium
  intent: "Plan the pick of graspable with the grasp_contact policy and run the planned pick before the taught drop."
  prompt: after command_gripper, plan the pick of graspable with contact policy grasp_contact, then execute the planned pick before the drop
  preconditions:
    fixtures: *planned_pick_fixtures
  outcome:
    clarify: none
    draft: &planned_pick_checks
      # any new pick_planning_result key (the model names it)
      - blackboard_key: {present: true, type: pick_planning_result}
      - node: {node_id: planning.plan_pick_sequence, ancestor: pick_and_place,
               parameters: {target.component_id: ur10e_robot, tool_target.component_id: robotiq_2f_140,
                            contact_policy_id: grasp_contact}}
      # the object: graspable, or the fixture key pick_target (initial graspable)
      - any_of:
          - - node: {node_id: planning.plan_pick_sequence, parameters: {selected_object_id: graspable}}
          - - node: {node_id: planning.plan_pick_sequence, value_sources: {selected_object_id: {kind: blackboard_key, reference: pick_target}}}
      - any_of:
          - - node: {node_id: planning.plan_pick_sequence, parameters: {tool_position.kind: named_preset, tool_position.name: closed}}
          - - node: {node_id: planning.plan_pick_sequence, parameters: {tool_position.kind: angular_rad, tool_position.value_rad: 0.66}}
      # approach
      - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
               value_sources: {goal: {kind: blackboard_field, field: approach_pose}}}
      - subtree_order: {root: pick_and_place, order: [command_gripper, {node_id: planning.plan_pick_sequence},
                        {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}}]}
      # descend: the planned path or a move to its end pose, under the plan's contact policy
      - any_of:
          - - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place, parameters: {contact_policy_id: grasp_contact},
                     value_sources: {path: {kind: blackboard_field, field: descend_path}}}
            - subtree_order: {root: pick_and_place, order: [
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}},
                {node_id: motion.follow_cartesian_path, value_sources: {path: {kind: blackboard_field, field: descend_path}}},
                {node_id: scene.attach_carried_object}]}
          - - node: {node_id: motion.move_to_pose, ancestor: pick_and_place, parameters: {contact_policy_id: grasp_contact},
                     value_sources: {goal: {kind: blackboard_field, field: pick_pose}}}
            - subtree_order: {root: pick_and_place, order: [
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}},
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: pick_pose}}},
                {node_id: scene.attach_carried_object}]}
      # attach graspable
      - any_of:
          - - node: {node_id: scene.attach_carried_object, ancestor: pick_and_place, parameters: {scene_resource_id: graspable}}
          - - node: {node_id: scene.attach_carried_object, ancestor: pick_and_place,
                     value_sources: {scene_resource_id: {kind: blackboard_field, field: selected_object_id}}}
          - - node: {node_id: scene.attach_carried_object, ancestor: pick_and_place,
                     value_sources: {scene_resource_id: {kind: blackboard_key, reference: pick_target}}}
      # close, right next to the attach (either order)
      - any_of:
          - - node: {node_id: gripper.command_position, before: scene.attach_carried_object,
                     value_sources: {position: {kind: blackboard_field, field: tool_position}}}
          - - node: {node_id: gripper.command_position, after: scene.attach_carried_object,
                     value_sources: {position: {kind: blackboard_field, field: tool_position}}}
          - - node: {node_id: gripper.command_position, before: scene.attach_carried_object,
                     parameters: {position.kind: named_preset, position.name: closed}}
          - - node: {node_id: gripper.command_position, after: scene.attach_carried_object,
                     parameters: {position.kind: named_preset, position.name: closed}}
          - - node: {node_id: gripper.command_position, before: scene.attach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.66}}
          - - node: {node_id: gripper.command_position, after: scene.attach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.66}}
      # retreat, before the taught drop
      - any_of:
          - - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place,
                     value_sources: {path: {kind: blackboard_field, field: retreat_path}}}
            - subtree_order: {root: pick_and_place, order: [{node_id: scene.attach_carried_object},
                {node_id: motion.follow_cartesian_path, value_sources: {path: {kind: blackboard_field, field: retreat_path}}},
                move_to_drop_approach]}
          - - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
                     value_sources: {goal: {kind: blackboard_field, field: retreat_pose}}}
            - subtree_order: {root: pick_and_place, order: [{node_id: scene.attach_carried_object},
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: retreat_pose}}},
                move_to_drop_approach]}
    unchanged: true
    allow_new_node_ids: [sequence]
    diagnostics: no_new_errors
    answer: {consistent: true}
    repair: *planned_pick_golden

- id: N2_PLAN_pick_execute_generic
