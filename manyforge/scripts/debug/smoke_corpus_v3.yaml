          - - node: {node_id: sequence, parent: pick_and_place}
          - []
      # v3e: ... and so is the stored_pose key it writes
      - any_of:
          - - blackboard_key: {present: true, type: stored_pose}
          - []
      - subtree_order: {root: pick_and_place, order: [{node_id: geometry.check_pose_distance}, close_gripper]}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

