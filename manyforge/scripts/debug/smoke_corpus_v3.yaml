      # Other motion nodes stay bound to the Program parameter, whose default stays 0.5.
      - node: {instance_id: move_to_pick_approach, effective_parameters: {velocity_scale: 0.25},
               parameters: {target_mode: relative, goal.position_m: [0.0, 0.0, 0.1],
                            target_reference.scene_resource_id: graspable,
                            target.component_id: ur10e_robot, tcp_endpoint.kind: current}}
      # merge: dropped the value_sources check on move_to_pick; unchanged: true already requires it to stay bound.
      - parameter: {id: velocity_scale, present: true, default: 0.5}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

