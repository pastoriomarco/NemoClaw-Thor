                     parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true}}
          - - node: {node_id: [io.check_input, io.wait_for_input], parent: pick_and_place, before: close_gripper,
                     parameters: {signal.component_id: cell_io, signal.signal_name: part_present, expected_value: true}}
          - - node: {node_id: [io.check_input, io.wait_for_input], parent: pick_and_place, index: 0,
