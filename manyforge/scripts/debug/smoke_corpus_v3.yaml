- id: N2_PLAN_place_execute_medium
  category: n2_planning
  detail_level: medium
  intent: "After the taught pick, plan putting graspable down at the drop position and run the planned place before return_rest."
  prompt: after pick_retreat, plan putting graspable down at (0.3, 0.3, 0.05) in the UR10e base frame with the tool pointing down, then execute that planned place before return_rest
  preconditions:
    fixtures: *planned_place_fixtures
  outcome:
    clarify: none
    draft:
      - blackboard_key: {present: true, type: pick_planning_result}
      # "tool pointing down" leaves the yaw open, so only the position is checked
      - node: {node_id: planning.plan_place_sequence, ancestor: pick_and_place,
               parameters: {target.component_id: ur10e_robot, tool_target.component_id: robotiq_2f_140,
                            selected_object_id: graspable, place_pose.position_m: [0.3, 0.3, 0.05]}}
      - any_of:
          - - node: {node_id: planning.plan_place_sequence, parameters: {tool_position.kind: named_preset, tool_position.name: open}}
          - - node: {node_id: planning.plan_place_sequence, parameters: {tool_position.kind: angular_rad, tool_position.value_rad: 0.0}}
      - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
               value_sources: {goal: {kind: blackboard_field, field: approach_pose}}}
      - subtree_order: {root: pick_and_place, order: [pick_retreat, {node_id: planning.plan_place_sequence},
                        {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}}]}
      - any_of:
          - - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place,
                     value_sources: {path: {kind: blackboard_field, field: descend_path}}}
            - subtree_order: {root: pick_and_place, order: [
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}},
                {node_id: motion.follow_cartesian_path, value_sources: {path: {kind: blackboard_field, field: descend_path}}},
                {node_id: scene.detach_carried_object}]}
          - - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
                     value_sources: {goal: {kind: blackboard_field, field: pick_pose}}}
            - subtree_order: {root: pick_and_place, order: [
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: approach_pose}}},
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: pick_pose}}},
                {node_id: scene.detach_carried_object}]}
      - any_of:
          - - node: {node_id: scene.detach_carried_object, ancestor: pick_and_place, parameters: {scene_resource_id: graspable}}
          - - node: {node_id: scene.detach_carried_object, ancestor: pick_and_place,
                     value_sources: {scene_resource_id: {kind: blackboard_field, field: selected_object_id}}}
      - any_of:
          - - node: {node_id: gripper.command_position, before: scene.detach_carried_object,
                     value_sources: {position: {kind: blackboard_field, field: tool_position}}}
          - - node: {node_id: gripper.command_position, after: scene.detach_carried_object,
                     value_sources: {position: {kind: blackboard_field, field: tool_position}}}
          - - node: {node_id: gripper.command_position, before: scene.detach_carried_object,
                     parameters: {position.kind: named_preset, position.name: open}}
          - - node: {node_id: gripper.command_position, after: scene.detach_carried_object,
                     parameters: {position.kind: named_preset, position.name: open}}
          - - node: {node_id: gripper.command_position, before: scene.detach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.0}}
          - - node: {node_id: gripper.command_position, after: scene.detach_carried_object,
                     parameters: {position.kind: angular_rad, position.value_rad: 0.0}}
      - any_of:
          - - node: {node_id: motion.follow_cartesian_path, ancestor: pick_and_place,
                     value_sources: {path: {kind: blackboard_field, field: retreat_path}}}
            - subtree_order: {root: pick_and_place, order: [{node_id: scene.detach_carried_object},
                {node_id: motion.follow_cartesian_path, value_sources: {path: {kind: blackboard_field, field: retreat_path}}},
                return_rest]}
          - - node: {node_id: motion.move_to_pose, ancestor: pick_and_place,
                     value_sources: {goal: {kind: blackboard_field, field: retreat_pose}}}
            - subtree_order: {root: pick_and_place, order: [{node_id: scene.detach_carried_object},
                {node_id: motion.move_to_pose, value_sources: {goal: {kind: blackboard_field, field: retreat_pose}}},
                return_rest]}
    unchanged: true
    allow_new_node_ids: [sequence]
    diagnostics: no_new_errors
    answer: {consistent: true}
    repair: *planned_place_golden

# ---------------------------------------------------------------- runtime scene (declared = present at run start)
# Clarified rule (as N2_SCENE_add_object_runtime_specific): every resource a scene node names is declared in the
# Draft scene, and a declared resource is present when the run starts. So an object that appears mid-run is
# added there with scene.upsert_object, or removed earlier in the run and then added with scene.add_object
# (scene.add_object alone refuses an existing id). Both patterns are accepted; the remove may sit anywhere
# before the add. The declared Draft row is checked by shape only (its pose is the model's choice).

- id: N2_SCENE_runtime_cover_plate_medium
  category: n2_scene
  detail_level: medium
  intent: "A cover plate appears on the outfeed after the drop; the Program adds it to the runtime scene at that point."
  prompt: right after detach_graspable, the operator lays a 0.3 x 0.3 x 0.01 m cover plate on the outfeed at (-0.3, 0.3, 0.005) in the cell frame; add it to the scene at that point as cover_plate
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - any_of:
          - - node: {node_id: scene.upsert_object, parent: pick_and_place, after: detach_graspable,
                     parameters: {scene_resource_id: cover_plate, shape.type: box, shape.box_dimensions_m: [0.3, 0.3, 0.01],
                                  pose.position_m: [-0.3, 0.3, 0.005]}}
          - - node: {node_id: scene.add_object, parent: pick_and_place, after: detach_graspable,
                     parameters: {scene_resource_id: cover_plate, shape.type: box, shape.box_dimensions_m: [0.3, 0.3, 0.01],
                                  pose.position_m: [-0.3, 0.3, 0.005]}}
            - node: {node_id: scene.remove_object, ancestor: pick_and_place, parameters: {scene_resource_id: cover_plate}}
            - subtree_order: {root: pick_and_place, order: [{node_id: scene.remove_object, parameters: {scene_resource_id: cover_plate}},
                                                             {node_id: scene.add_object}]}
      - scene_resource: {id: cover_plate, present: true, shape: {type: box, box_dimensions_m: [0.3, 0.3, 0.01]}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
    repair:
    - {"tool": "scene_draft_upsert_objects", "arguments": {"scene_resources": [{"scene_resource_id": "cover_plate", "shape": {"type": "box", "box_dimensions_m": [0.3, 0.3, 0.01]}, "pose": {"frame_ref": {"kind": "cell_frame"}, "position_m": [-0.3, 0.3, 0.005], "orientation": {"rpy_deg": [0.0, 0.0, 0.0]}}}]}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "detach_graspable", "node": {"node_id": "scene.upsert_object", "instance_id": "cover_plate_appears", "parameters": {"scene_resource_id": "cover_plate", "shape": {"type": "box", "box_dimensions_m": [0.3, 0.3, 0.01]}, "pose": {"frame_ref": {"kind": "cell_frame"}, "position_m": [-0.3, 0.3, 0.005], "orientation": {"rpy_deg": [0.0, 0.0, 0.0]}}}, "children": []}}}

