# Group 3 of the v2 (outcome form) corpus: scene, parameters, blackboard, clarification and
# runtime-scene cases. Start Program: mock_ur10e_assistant_scene_authoring.scenario/program.yaml
# (tree pick_and_place; scene resources graspable (box 0.1x0.01x0.01 at 0.3,-0.3,0.15, role pick_object)
# and ground; Program parameter velocity_scale float64 = 0.5; empty blackboard).
# Harness extension used in several cases: `scene_resource: {new: true, ...}` matches a resource that
# was not in the Draft before the conversation, for prompts that do not name an id.
# `preconditions` is the v1 `precondition` key, contents unchanged.

