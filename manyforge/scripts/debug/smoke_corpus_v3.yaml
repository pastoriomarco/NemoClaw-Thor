- id: N2_TASK_alarm_on_pick_failure
  category: n2_task
  detail_level: medium
  intent: "If the approach, descent or grasp fails, light the alarm and full-stop the cell."
  prompt: if any part of the pick (approach, descent or closing the gripper) fails, turn the alarm light on and do a full stop of the cell
  preconditions: {}
  outcome:
    clarify: none
    draft:
      - node: {instance_id: move_to_pick_approach, ancestor_node_id: fallback}
      - node: {instance_id: move_to_pick, ancestor_node_id: fallback}
      - node: {instance_id: close_gripper, ancestor_node_id: fallback}
      - node: {node_id: io.set_output, ancestor_node_id: fallback,
               parameters: {signal.component_id: cell_io, signal.signal_name: alarm_light, value: true}}
      - node: {node_id: kernel.full_stop, ancestor_node_id: fallback}
      - subtree_order: {root: pick_and_place,
                        order: [command_gripper, move_to_pick_approach, move_to_pick, close_gripper, attach_graspable]}
      - subtree_order: {root: pick_and_place, order: [{node_id: io.set_output}, {node_id: kernel.full_stop}]}
      # v3 (T1, BT semantics): the alarm branch is a fallback alternative that ends the cycle: exactly
      # [alarm, full stop] in a sequence directly under a fallback (a bare alarm would succeed and let the pick run).
      - node: {node_id: sequence, parent_node_id: fallback, children_node_ids: [io.set_output, kernel.full_stop]}
      # the guarded steps come before their alarm branch: one fallback around all three, or one per step
      - any_of:
          - - subtree_order: {root: pick_and_place, order: [move_to_pick_approach, move_to_pick, close_gripper,
                                                            {node_id: io.set_output}, {node_id: kernel.full_stop},
                                                            attach_graspable]}
          - - subtree_order: {root: pick_and_place, order: [move_to_pick_approach, {node_id: io.set_output},
                                                            {node_id: kernel.full_stop}, move_to_pick]}
    unchanged: true
    # one fallback around the three steps, or one per step (each with its own alarm + stop), are both fine
    allow_new_node_ids: [sequence, fallback, io.set_output, kernel.full_stop]
    diagnostics: no_new_errors
    answer: {consistent: true}

