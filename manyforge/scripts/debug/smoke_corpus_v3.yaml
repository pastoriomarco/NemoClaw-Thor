          present: true
          shape: {type: box, box_dimensions_m: [0.1, 0.01, 0.01]}
          pose: {frame_ref: {kind: cell_frame}, position_m: [0.35, -0.25, 0.15]}
    unchanged: true          # includes: no scene.update_object_pose node added to the tree
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: CUR_runtime_remove_then_restore_graspable
  category: current_runtime_scene_mutation
  detail_level: specific
  intent: "The operator wants the Program itself to remove graspable from the runtime scene at the end and upsert it back at its initial pose and size."
  prompt: 'at the end of pick_and_place, remove graspable from the runtime scene

    and then upsert it again at its initial scene pose and size

    '
  outcome:
    clarify: none
    draft:
      # Runtime change: it belongs in the Program tree, as two scene nodes at the end of pick_and_place.
      - node:
          node_id: scene.remove_object
          parent: pick_and_place
          after: return_rest
          parameters: {scene_resource_id: graspable}
      - node:
          node_id: scene.upsert_object
          parent: pick_and_place
          last_child: true
          parameters:
            scene_resource_id: graspable
            shape.type: box
            shape.box_dimensions_m: [0.1, 0.01, 0.01]
            pose.position_m: [0.3, -0.3, 0.15]
      - any_of:     # initial orientation is -45 deg yaw; quaternion or rpy both fulfil it
          - - node: {node_id: scene.upsert_object, parent: pick_and_place, parameters: {pose.orientation.xyzw: [0.0, 0.0, -0.3826834, 0.9238795]}}
          - - node: {node_id: scene.upsert_object, parent: pick_and_place, parameters: {pose.orientation.rpy_deg: [0.0, 0.0, -45.0]}}
      # The static scene is not edited: graspable stays in the Draft scene as it was.
      - scene_resource:
          id: graspable
          present: true
          shape: {type: box, box_dimensions_m: [0.1, 0.01, 0.01]}
          pose: {position_m: [0.3, -0.3, 0.15]}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true, must_contain: [runtime]}

- id: CUR_runtime_update_graspable_pose_each_cycle
  category: current_runtime_scene_mutation
  detail_level: medium
  intent: "The operator wants the Program to reset graspable's runtime pose to its start position after each cycle."
  prompt: after each cycle, set graspable's runtime pose back to [0.3, -0.3, 0.15]
  outcome:
    # v2: the Program has no loop; one run of pick_and_place is the cycle, so the reset goes at its end.
    # Wrapping in a repeat was not asked for. A question about "cycle" is acceptable.
    clarify: allowed
    clarification_answer: "Yes, at the end of the pick_and_place sequence."
    draft:
      # 2026-11-10 (clarified rule: a declared resource is present at run start): update its pose, upsert
      # it, or remove it and add it again (same size). The remove must come after detach_graspable: an
      # earlier remove would take the part away while the robot still carries it.
      - any_of:
          - - node:
                node_id: scene.update_object_pose
                parent: pick_and_place
                last_child: true
                parameters: {scene_resource_id: graspable, pose.position_m: [0.3, -0.3, 0.15]}
          - - node:
                node_id: scene.upsert_object
                parent: pick_and_place
                last_child: true
                parameters: {scene_resource_id: graspable, pose.position_m: [0.3, -0.3, 0.15]}
          - - node:
                node_id: scene.add_object
                parent: pick_and_place
                last_child: true
                parameters: {scene_resource_id: graspable, shape.type: box, shape.box_dimensions_m: [0.1, 0.01, 0.01],
                             pose.position_m: [0.3, -0.3, 0.15]}
            - node: {node_id: scene.remove_object, parent: pick_and_place, parameters: {scene_resource_id: graspable}}
            - subtree_order: {root: pick_and_place, order: [detach_graspable,
                              {node_id: scene.remove_object, parameters: {scene_resource_id: graspable}},
                              {node_id: scene.add_object}]}
      # Runtime change: the static Draft scene keeps graspable where it was.
      - scene_resource:
          id: graspable
          present: true
          pose: {position_m: [0.3, -0.3, 0.15]}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true, must_contain: [pose]}

- id: CLARIFY_scene_remove_pronoun
  category: clarification
  detail_level: generic
  intent: "The operator says 'remove it' with no referent; two scene objects are candidates."
  prompt: remove it from the scene
  outcome:
    # v2: graspable and ground are both candidates; removing either would be arbitrary and lose work.
    clarify: required
    clarification_answer: "The graspable."
    draft:
      # After the answer: graspable gone, ground untouched.
      - scene_resource: {id: graspable, present: false}
      - scene_resource: {id: ground, present: true}
    unchanged: true
    diagnostics: allow_incomplete     # dangling graspable references in the tree after the requested removal
    answer: {consistent: true}

- id: CLARIFY_tree_wrap_pronoun
  category: clarification
  detail_level: generic
  intent: "The operator wants some step wrapped in a retry but does not say which."
  prompt: wrap that step in a retry
  outcome:
    # v2: the tree has twelve steps and no "that" from context; wrapping any one is arbitrary.
    clarify: required
    clarification_answer: "The close_gripper step, with 3 attempts."
    draft:
      - node:
          node_id: retry
          parent: pick_and_place
          after: move_to_pick
          children_node_ids: [gripper.command_position]
      - node: {instance_id: close_gripper, node_id: gripper.command_position, parent_node_id: retry}
      - scene_resource: {id: graspable, present: true}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

- id: CLARIFY_motion_generic
  category: clarification
  detail_level: generic
  intent: "The operator wants the robot to move 'over there' with no target given."
  prompt: make the robot move over there
  outcome:
    # v2: no target is known; any motion node or scene change would be arbitrary and moves a robot.
    # No clarification_answer: the next turn would need a real target and a scripted pose adds nothing.
    clarify: required
    draft:
      - scene_resource: {id: graspable, present: true}
      - scene_resource: {id: ground, present: true}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

# ===== smoke_corpus_v2_n2.yaml (g4-new) =====

# ===== fragment g4-new.yaml =====
# Group g4: NEW cases (N2_*), outcome form (manyforge.assistant_smoke_corpus.v2).
#
# Scenario (default): examples/mock_ur10e_assistant_scene_authoring.scenario, extended 2026-11-09 into a
# Mock pick-and-place workcell. Program unchanged: sequence pick_and_place with 12 flat children
#   command_gripper, move_to_pick_approach, move_to_pick, close_gripper, attach_graspable, pick_retreat,
#   move_to_drop_approach, move_to_drop, open_gripper, detach_graspable, drop_retreat, return_rest.
#   Moves bind velocity_scale to the Program parameter velocity_scale (0.5). Scene: graspable, ground.
#   No blackboard keys, no contact policies.
# Deployment additions: Mock I/O device cell_io (command target io)
#   inputs : part_present (pick-table part sensor, starts true), clamp_pressure_ok (drop-fixture clamp
#            pressure switch, follows clamp_valve after 300 ms), touch_probe, start_button, zone_occupied
#            (area scanner)
#   outputs: clamp_valve, alarm_light, ready_light
#   rule   : zone_intrusion (all_motion stop while zone_occupied is true, active at start)
# Targets: arm = {component_id: ur10e_robot, command_target_id: arm} (base frame "base");
#   gripper = {component_id: robotiq_2f_140, command_target_id: gripper} (frame "tcp").
# Robotiq 2F-140 positions: open = named_preset open or angular 0.0 rad; closed = named_preset closed or
#   angular 0.66 rad (as in the demo Program); both encodings are accepted where the prompt says open/closed.
#
# scenario: sim -> examples/sim_ur10e_assistant_scene_authoring.scenario (unchanged; root sequence
#   isaac_light_cycle: set_cheese_initial_pose, play_simulation, wait_for_simulation, open_gripper_start, ...
#   return_rest, reset_simulation, wait_after_reset (timer 3 s), pause_simulation).
#
# Check forms beyond the plan appendix. Forms from g2 reused: node.parent: null; node_id as a list (any of);
# node.ancestor; node.value_sources; node.effective_parameters; {max_exclusive: x}; subtree_order;
# children_order: any. Forms NEW in g4 (the scorer must support or reject them):
#   node.ancestor_node_id: X        some ancestor of the node has node_id X (X may be a list: any of).
#   subtree_order.root_node_id: X   the root is the (single) new node with node_id X, instead of an instance id.
#   subtree_order.order entries     may be a node match {node_id, parameters?, value_sources?} (first
#                                   pre-order match) as well as an instance id; the entries must appear in
#                                   this pre-order (other nodes may sit between them).
#   parameters keys with list index 'path[-2].position_m', 'path[-1].position_m'.
#   {min_exclusive: x}              in place of a number.
#   blackboard_key without key      any new key of that type is present (model chooses the name).
#   parameter without id            any new parameter matching type/default is present.
#   contact_policy {id?, present?, mode?}  a contact policy (by policy_id; without id any new one with that
#                                   mode). A new policy needs an outcome.repair (the full shape).
#   outcome.allow_new_node_ids      with unchanged: true, extra NEW nodes with these node_ids (control-flow
#                                   glue such as sequence/fallback) are tolerated beyond the checked ones.
#   scenario: sim                   the case runs on the sim scenario below instead of the default.
# Fixtures use the Draft mutation tools as in v1 (blackboard_draft_upsert_keys,
# program_draft_upsert_parameters, program_draft_upsert_contact_policies; Composer computes the contact
# policy version).

