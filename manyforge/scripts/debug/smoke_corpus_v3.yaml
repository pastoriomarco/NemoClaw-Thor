    - {"tool": "tree_draft_insert_node", "arguments": {"parent_instance_id": "drop_or_replan", "index": 1, "node": {"node_id": "sequence", "instance_id": "replan_drop", "parameters": {}, "children": [{"node_id": "recovery.apply_offered_action", "instance_id": "replan_after_stop", "parameters": {"target": {"component_id": "ur10e_robot", "command_target_id": "arm"}, "recovery_action": "replan_from_stopped_state"}, "children": []}, {"node_id": "motion.move_to_pose", "instance_id": "move_to_drop_again", "parameters": {"base_frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "execution_timeout_s": 30.0, "goal": {"frame_ref": {"frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "kind": "target_frame"}, "orientation": {"rpy_deg": [180.0, 0.0, -180.0]}, "position_m": [0.3, 0.3, 0.05]}, "joint_position_tol_rad": 0.05, "planning_timeout_s": 10.0, "target": {"command_target_id": "arm", "component_id": "ur10e_robot"}, "tcp_endpoint": {"kind": "current"}}, "value_sources": {"velocity_scale": {"kind": "program_parameter", "reference": "velocity_scale"}}, "children": []}]}}}

