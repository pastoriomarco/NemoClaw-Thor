- id: N2_MOTION_probe_top_generic
  category: n2_motion
  detail_level: generic
  intent: "Find the top of the part with the touch probe between the approach and the grasp."
  prompt: before grasping, feel for the top of the part with the touch probe
  preconditions: {}
  outcome:
    # Acting directly: a signal-stopped move on touch_probe between the approach and close_gripper; the goal
    # pose is the model's choice then. (probe_search would need a contact policy, which this Program lacks.)
    clarify: allowed
    clarification_answer: Use a move from the approach down to (0.3, -0.3, 0.14) in the UR10e base frame, tool pointing down, that stops when touch_probe turns on; put it right after move_to_pick_approach.
    draft:
      - any_of:
          - - node: {node_id: motion.move_until_signal, parent: pick_and_place, after: move_to_pick_approach,
