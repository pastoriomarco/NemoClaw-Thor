    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "pick_retreat", "node": {"node_id": "scene.upsert_object", "instance_id": "place_tray_appears", "parameters": {"scene_resource_id": "place_tray", "shape": {"type": "box", "box_dimensions_m": [0.2, 0.2, 0.02]}, "pose": {"frame_ref": {"kind": "cell_frame"}, "position_m": [0.3, 0.3, 0.01], "orientation": {"rpy_deg": [0.0, 0.0, 0.0]}}}, "children": []}}}
    - {"tool": "blackboard_draft_upsert_keys", "arguments": {"keys": [{"key": "place_plan", "type": "pick_planning_result", "access": "read_write", "persistence": "run", "description": "Planned place of graspable.", "fields": [{"field": "approach_pose", "type": "stored_pose"}, {"field": "descend_path", "type": "cartesian_path"}, {"field": "pick_pose", "type": "stored_pose"}, {"field": "retreat_path", "type": "cartesian_path"}, {"field": "retreat_pose", "type": "stored_pose"}, {"field": "selected_object_id", "type": "scene_resource"}, {"field": "tool_position", "type": "coordinate_position"}]}]}}
    - {"tool": "tree_draft_insert_node", "arguments": {"after_instance_id": "place_tray_appears", "node": {"node_id": "planning.plan_place_sequence", "instance_id": "plan_place", "parameters": {"target": {"component_id": "ur10e_robot", "command_target_id": "arm"}, "tool_target": {"component_id": "robotiq_2f_140", "command_target_id": "gripper"}, "base_frame": {"component_id": "ur10e_robot", "frame_id": "base"}, "carrier_frame_ref": {"component_id": "robotiq_2f_140", "frame_id": "tcp"}, "selected_object_id": "graspable", "place_pose": {"frame_ref": {"kind": "target_frame", "frame": {"component_id": "ur10e_robot", "frame_id": "base"}}, "position_m": [0.3, 0.3, 0.05], "orientation": {"rpy_deg": [180.0, 0.0, -180.0]}}, "tool_position": {"kind": "named_preset", "name": "open"}, "output_key": "place_plan"}, "children": []}}}
