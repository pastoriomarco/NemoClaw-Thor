- id: PARALLEL_concurrent_medium
  category: tree_insert_parallel
  detail_level: medium
  intent: The operator wants the gripper opened and some status update to run concurrently inside a parallel node.
  prompt: add a parallel that runs gripper open and a status update at the same time
  outcome:
    # v2: the placement and what "status update" means are not given, but the request is
    # answerable by a plausible reading (a gripper status check); acting is accepted if the
    # answer states the reading. v1 required a question only because the model could not act.
    clarify: allowed
    clarification_answer: "As the last step of pick_and_place, after return_rest. Use success_policy all; the second branch waits until the gripper reports it reached its target."
    draft:
      # 2026-11-10: open as the named preset or 0.0 rad (as everywhere in the corpus); every plausible
      # "status update" that works at run time:
      #   - waiting until the gripper reports it reached its target (gripper.wait_for_status reached);
      #     v3 (T1, BT semantics): gripper.check_status runs at the same instant as the open command,
      #     sees "moving" (or "idle"), fails and fails the parallel, so it is not accepted;
      #   - setting the ready_light status output (io.set_output on cell_io; either level);
      #   - writing a status value to a new blackboard key (logic.set_value).
      # With an instant branch (output or value), success_policy one would end the parallel and stop the
      # open at once, so the policy must be all (stated, or omitted: the default is all).
      - any_of:
          - - node: {node_id: parallel, parent: pick_and_place,
                     children_node_ids: [gripper.command_position, gripper.wait_for_status], children_order: any}
            - node: {node_id: gripper.wait_for_status, parent_node_id: parallel, parameters: {expected_state: reached}}
          - - node: {node_id: parallel, parent: pick_and_place,
                     children_node_ids: [gripper.command_position, io.set_output], children_order: any}
            - node: {node_id: io.set_output, parent_node_id: parallel,
                     parameters: {signal.component_id: cell_io, signal.signal_name: ready_light}}
          - - node: {node_id: parallel, parent: pick_and_place,
                     children_node_ids: [gripper.command_position, logic.set_value], children_order: any}
            - blackboard_key: {present: true}
      - any_of:
          - - node: {node_id: parallel, parent: pick_and_place, parameters: {success_policy: all}}
          - - node: {node_id: parallel, parent: pick_and_place, children_node_ids: [gripper.command_position, gripper.wait_for_status],
                     children_order: any}
          - - node: {node_id: parallel, parent: pick_and_place, parameters: {success_policy: {absent: true}}}
      - any_of:
          - - node: {node_id: gripper.command_position, parent_node_id: parallel, parameters: {position.kind: angular_rad, position.value_rad: 0.0}}
          - - node: {node_id: gripper.command_position, parent_node_id: parallel, parameters: {position.kind: named_preset, position.name: open}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
