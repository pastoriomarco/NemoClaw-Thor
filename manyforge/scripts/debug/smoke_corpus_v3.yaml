# ---------------------------------------------------------------- motion ------------------------------------
- id: N2_MOTION_cartesian_path_medium
  category: n2_motion
  detail_level: medium
  intent: "After the pick retreat, move in a straight line through two given base-frame points."
  prompt: after pick_retreat, add one straight-line Cartesian move of the UR10e through (0.3, 0.0, 0.3) and then (0.3, 0.3, 0.3) in its base frame, keeping the tool pointing down
  preconditions: {}
  outcome:
    clarify: none
    draft:
      # the last two waypoints are the stated points (a leading start waypoint is allowed); orientation is
      # not checked because "pointing down" leaves the yaw open.
      - node:
          node_id: motion.follow_cartesian_path
          parent: pick_and_place
          after: pick_retreat
          parameters:
            target.component_id: ur10e_robot
            target.command_target_id: arm
            base_frame.frame_id: base
            'path[-2].position_m': [0.3, 0.0, 0.3]
            'path[-1].position_m': [0.3, 0.3, 0.3]
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}

