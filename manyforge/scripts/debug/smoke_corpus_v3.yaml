      - node: {node_id: recovery.apply_offered_action, parent_node_id: sequence,
               parameters: {target.component_id: ur10e_robot, recovery_action: replan_from_stopped_state}}
      # the second move goes to the drop pose (0.3, 0.3, 0.05; base frame = cell frame here)
      - node: {node_id: motion.move_to_pose, parent_node_id: sequence, index: 1,
               parameters: {target.component_id: ur10e_robot, goal.position_m: [0.3, 0.3, 0.05]}}
    unchanged: true
    diagnostics: no_new_errors
    answer: {consistent: true}
