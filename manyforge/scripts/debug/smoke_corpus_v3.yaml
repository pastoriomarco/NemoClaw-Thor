- id: N2_RECOVERY_replan_generic
  category: n2_recovery
  detail_level: generic
  intent: "When the drop move is stopped, replan it from where it stopped."
  prompt: when the drop move gets stopped, let it replan from where it stopped
  preconditions: {}
  outcome:
    # 2026-11-10: replan_from_stopped_state only releases the stopped operation (the Kernel issues no
    # motion: execution_kernel.cpp "motion-free local retirement ONLY"), so the drop move must run again
    # after it: fallback [move_to_drop, sequence [apply recovery, a move to the drop pose]]. Applying the
    # recovery alone would let the Program open the gripper wherever the arm stopped, so it fails.
    # automatic_retries is not accepted as a reading: it replans only after planning no-effect or a
    # nominal collision stop (v2_owner._AUTOMATIC_RETRY_CAUSES), is already 3 by default on this move,
    # and does not cover a rule or operator stop (here the zone_intrusion stop).
    clarify: allowed
    clarification_answer: Yes, if move_to_drop fails, apply the replan_from_stopped_state recovery to the UR10e arm and then move to the drop pose again.
    draft:
      - node: {node_id: fallback, parent: pick_and_place, after: move_to_drop_approach,
